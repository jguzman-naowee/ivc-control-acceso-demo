<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IVC · Radicación · Fase 1 (Demo) — Naowee</title>

<!-- Fuente Google Sans -->
<link rel="stylesheet" href="../shared/fonts/google-sans.css">

<!-- Naowee Design System v1.8.0 canónico -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/naowee-tech/naowee-design-system@v1.8.0/dist/design-system.css">

<style>
  /* ============================================================
     CSS scoped al módulo IVC — solo tokens locales para layout
     y patrón wizard-page (no override de clases .naowee-*).
     ============================================================ */
  :root {
    --accent: var(--naowee-color-feedback-fill-caution-loud, #d74009);
    --orange-bg: #fff3e6;
    --text-primary: var(--naowee-color-text-primary, #282834);
    --text-secondary: var(--naowee-color-text-secondary, #646587);
    --border: var(--naowee-color-border-mute, #e7e9f3);
    --border-dark: var(--naowee-color-border-default, #d0d4e6);
    --header-h: 72px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: #f5f6fa;
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }

  /* ============================================================
     HEADER · estilo v2.0.3 (Ministerio + Naowee + SUID)
     ============================================================ */
  .ivc-top-header {
    height: var(--header-h);
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 90;
  }
  .ivc-top-header__brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-right: auto;
  }
  .ivc-top-header__logos {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ivc-top-header__logos img.l-min { height: 38px; width: auto; display: block; }
  .ivc-top-header__logos img.l-suid { height: 28px; width: auto; display: block; }
  .ivc-top-header__logos img.l-naowee { height: 22px; width: auto; display: block; opacity: .9; }
  .ivc-top-header__sep {
    width: 1px; height: 28px; background: var(--border);
  }
  .ivc-top-header__title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.2;
  }
  .ivc-top-header__subtitle {
    font-size: 11.5px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .ivc-top-header__meta {
    display: flex; align-items: center; gap: 12px;
  }
  @media (max-width: 760px) {
    .ivc-top-header { padding: 0 16px; }
    .ivc-top-header__logos img.l-naowee,
    .ivc-top-header__sep { display: none; }
    .ivc-top-header__title-wrap { display: none; }
  }

  /* ============================================================
     WIZARD-PAGE pattern (espejo de v2.0.3/shared/wizard-page.css)
     ============================================================ */
  .wz-page {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  .wz-page__header { margin-bottom: 18px; }
  .wz-page__title {
    margin: 8px 0 4px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--text-primary);
    line-height: 1.15;
  }
  .wz-page__subtitle {
    color: var(--text-secondary);
    margin: 0 0 8px;
    font-size: 14px;
    line-height: 1.5;
  }
  .wz-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    /* FIX #3: elevation removida — card plana contra el fondo (Doug 23/05/2026) */
    overflow: hidden;
  }

  /* Stepper wrapper (usa .naowee-stepper canónico)
     v1.4.7 (23/05/2026): layout vertical (número arriba / label abajo) +
     connector alineado a la altura del número (no del label). Resuelve:
     1) pulse del paso activo no se corta (overflow visible + padding-top)
     2) líneas de progreso ya no pisan los labels (van a la altura del círculo) */
  .wz-stepper-wrap {
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: center;
    background: #fff;
    overflow: visible;
  }
  .wz-stepper-wrap .naowee-stepper {
    width: 100%;
    max-width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0;
    padding: 0;
    background: transparent;
    border-bottom: 0;
    overflow: visible;
  }
  .wz-stepper-wrap .naowee-stepper__step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
    flex-shrink: 0;
    cursor: default;
    min-width: 0;
  }
  .wz-stepper-wrap .naowee-stepper__number {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    flex-shrink: 0;
    background: #f5f6fa;
    color: var(--text-secondary);
    transition: all .2s;
  }
  /* FIX #2 (23/05/2026): labels completos en el stepper (sin abreviar/ellipsis).
     11.5px en pasos no-activos, 13px en el activo, el wrap permite que entren los
     7 nombres en desktop manteniendo el separador como flex:1. */
  .wz-stepper-wrap .naowee-stepper__label {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-secondary);
    white-space: nowrap;
    transition: color .2s, font-size .2s;
  }
  .wz-stepper-wrap .naowee-stepper__step--active .naowee-stepper__number {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 0 4px rgba(215,64,9,.12);
  }
  .wz-stepper-wrap .naowee-stepper--pulse .naowee-stepper__step--active .naowee-stepper__number {
    animation: wzStepperPulse 2s cubic-bezier(.4, 0, .6, 1) infinite;
  }
  @keyframes wzStepperPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(215, 64, 9, .45); }
    50%      { box-shadow: 0 0 0 8px rgba(215, 64, 9, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wz-stepper-wrap .naowee-stepper--pulse .naowee-stepper__step--active .naowee-stepper__number {
      animation: none;
    }
  }
  .wz-stepper-wrap .naowee-stepper__step--active .naowee-stepper__label {
    color: var(--text-primary);
    font-weight: 600;
    font-size: 13px;
  }
  .wz-stepper-wrap .naowee-stepper__step--done .naowee-stepper__number {
    background: #15803d; color: #fff;
  }
  .wz-stepper-wrap .naowee-stepper__step--done .naowee-stepper__label {
    color: var(--text-primary);
  }
  .wz-stepper-wrap .naowee-stepper__step--done { cursor: pointer; }
  .wz-stepper-wrap .naowee-stepper__step--done:hover .naowee-stepper__label { color: var(--accent); }
  .wz-stepper-wrap .naowee-stepper__connector {
    flex: 1 1 auto;
    height: 2px;
    background: var(--border);
    margin: 12px 8px 0;   /* margin-top alinea con el centro del número 26px */
    border-radius: 1px;
    min-width: 8px;
    align-self: flex-start;
  }
  .wz-stepper-wrap .naowee-stepper__connector--done { background: #15803d; }

  /* v1.13.54 (Juanma 27/05/2026): skeleton de los pasos restantes ANTES de
     elegir organismo. Solo puntos grises + línea del recorrido (sin label ni
     número) — sugiere "vienen ~5-6 pasos más" sin comprometer el conteo
     exacto, que lo define el tipo de organismo. */
  .wz-stepper-wrap .naowee-stepper__step--skeleton .naowee-stepper__number {
    width: 11px; height: 11px; min-width: 11px;
    background: var(--border, #e7e9f3);
    box-shadow: none;
    margin-top: 8px;   /* centra el dot 11px con la línea del connector (centro ≈13px) */
    animation: none;
  }
  .wz-stepper-wrap .naowee-stepper__connector--skeleton {
    background: var(--border, #e7e9f3);
    opacity: .65;
  }

  .wz-stepper-mobile {
    display: none;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .wz-stepper-mobile small {
    display: block;
    font-size: 11.5px;
    color: var(--text-secondary);
    font-weight: 500;
    margin-top: 2px;
  }
  @media (max-width: 760px) {
    .wz-stepper-wrap { display: none; }
    .wz-stepper-mobile { display: block; }
  }

  /* Body wizard */
  .wz-body { padding: 24px 28px; }
  .wz-step-panel { display: none; animation: wzStepFadeIn .3s cubic-bezier(.32,.72,0,1) both; }
  .wz-step-panel.is-active { display: block; }
  @keyframes wzStepFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .wz-section {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: #b5b9d4;
    margin: 22px 0 12px;
  }
  .wz-section:first-child { margin-top: 0; }
  .wz-grid-2 {
    display: grid;
    gap: 16px;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    margin-bottom: 18px;
    align-items: start;
  }
  .wz-grid-3 {
    display: grid;
    gap: 16px;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
    margin-bottom: 18px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .wz-grid-2, .wz-grid-3 { grid-template-columns: 1fr; }
  }
  .wz-step-panel > .naowee-textfield,
  .wz-step-panel > .naowee-dropdown { margin-bottom: 18px; }
  .wz-grid-2 > .naowee-textfield,
  .wz-grid-2 > .naowee-dropdown,
  .wz-grid-3 > .naowee-textfield,
  .wz-grid-3 > .naowee-dropdown { margin-bottom: 0; }

  /* Footer wizard */
  .wz-footer {
    padding: 18px 28px;
    border-top: 1px solid var(--border);
    background: #fff;
    display: flex;
    align-items: center;
    /* v1.13.56 #3: CTAs en puntas opuestas (Anterior izq · Continuar der).
       En step 1 (sin Anterior) el margin-left:auto del Continuar lo empuja a la derecha. */
    justify-content: space-between;
    gap: 12px;
  }
  /* Cuando solo está Continuar (btnBack oculto), que quede a la derecha. */
  .wz-footer > #btnNext { margin-left: auto; }

  /* ═══ v1.13.57 (Doug 27/05/2026): en mobile los popovers (dropdowns +
     datepicker) emergen como BOTTOM-SHEET — anclados al borde inferior y
     deslizando DE ABAJO HACIA ARRIBA (animado), cerca del pulgar (no lejos
     del área tappable). Full-width, esquinas superiores redondeadas, tope
     95vh content-sized con scroll. El datepicker muestra el calendario dentro. ═══ */
  @media (max-width: 640px) {
    /* Backdrop dim detrás del sheet (CSS-only via :has). */
    body:has(.naowee-dropdown--open)::before,
    body:has(.ivc-dropdown--open)::before,
    body:has(.naowee-datepicker--open)::before {
      content: '';
      position: fixed; inset: 0;
      background: rgba(40, 40, 52, .4);
      z-index: 9998;
      animation: ivcSheetBackdrop .22s ease;
    }
    @keyframes ivcSheetBackdrop { from { opacity: 0; } to { opacity: 1; } }

    /* Sheet base (cerrado: fuera de pantalla por abajo). Ambos popovers están
       portaleados a <body> con position:fixed + top/left/width inline; !important
       vence esos inline. El estado abierto del dropdown vive en el inline
       "visibility: visible" del menu; el del datepicker en la clase --open. */
    .naowee-dropdown__menu,
    .naowee-datepicker--popover {
      top: auto !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100% !important;
      max-width: none !important;
      min-width: 0 !important;
      max-height: 95vh !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      z-index: 9999 !important;
      border-radius: 18px 18px 0 0 !important;
      box-shadow: 0 -8px 40px rgba(40, 40, 52, .22) !important;
      transform: translateY(100%) !important;
      transition: transform .32s cubic-bezier(.32, .72, 0, 1) !important;
      padding-bottom: max(12px, env(safe-area-inset-bottom)) !important;
    }
    /* Abierto: sube a su posición (slide-up). */
    .naowee-dropdown__menu[style*="visible"],
    .naowee-datepicker--popover.naowee-datepicker--open {
      transform: translateY(0) !important;
    }
    /* Touch targets cómodos. */
    .naowee-dropdown__menu .naowee-dropdown__option {
      padding: 15px 18px !important;
      font-size: 15px !important;
    }
    .naowee-datepicker--popover.naowee-datepicker--open .naowee-datepicker__calendar {
      width: 100% !important;
    }
  }
  /* File drop (canónico v2.0.3)
     v1.5.7 (25/05/2026): padding e icono más sutiles (feedback Doug). */
  .wz-file-drop {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    padding: 18px 18px;
    border: 1.5px dashed var(--border-dark);
    border-radius: 12px;
    background: #fafbff;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .wz-file-drop:hover { border-color: var(--accent); background: #fff8f4; }
  .wz-file-drop.is-filled {
    border-style: solid;
    border-color: #15803d;
    background: #f0faf2;
  }
  .wz-file-drop__icon { color: var(--text-secondary); display: inline-flex; }
  .wz-file-drop.is-filled .wz-file-drop__icon { color: #15803d; }
  .wz-file-drop__title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .wz-file-drop__hint { font-size: 11.5px; color: var(--text-secondary); text-align: center; }
  .wz-file-drop__name { font-size: 12.5px; font-weight: 600; color: #15803d; margin-top: 4px; }
  .wz-file-drop input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  /* ── v1.5.7 (25/05/2026): override scoped para igualar textfield al dropdown ──
     El DS canónico Naowee tiene inconsistencia interna: textfield usa
     --naowee-color-gray-600 (#8788AB · darker) y dropdown usa
     --naowee-color-gray-300 (#D0D4E6 · lighter). Feedback Doug: que se vean
     idénticos. Aplicamos el color del dropdown al textfield. */
  .wz-card .naowee-textfield__input-wrap,
  .ivc-modal .naowee-textfield__input-wrap {
    border-color: var(--naowee-color-gray-300, #d0d4e6);
  }
  .wz-card .naowee-textfield__input-wrap:hover,
  .ivc-modal .naowee-textfield__input-wrap:hover {
    border-color: var(--naowee-color-interactive-border-hover, #8788ab);
  }
  /* Placeholder del textfield igualado al del dropdown (text-secondary, regular). */
  .wz-card .naowee-textfield__input::placeholder,
  .ivc-modal .naowee-textfield__input::placeholder {
    color: var(--naowee-color-text-secondary, #646587);
    font-weight: 400;
  }
  /* v1.13.55 (Doug 27/05/2026) #1: focus canónico del textfield — borde naranja
     + 3px shadow accent (igual que .ivc-mini-input y el DS). Faltaba el estado.
     Scoped bajo .wz-card/.ivc-modal para vencer la regla default scoped, color
     concreto para evitar cualquier issue de resolución de var. */
  .wz-card .naowee-textfield__input-wrap:focus-within,
  .ivc-modal .naowee-textfield__input-wrap:focus-within,
  .naowee-textfield__input-wrap:focus-within {
    border-color: #d74009 !important;
    box-shadow: 0 0 0 3px rgba(215, 64, 9, .15) !important;
  }
  /* #5: reducir el gap title↔content de .naowee-message (el DS trae gap:16px,
     se ve demasiado aire). Lo bajamos a 3px. */
  .naowee-message__content { gap: 3px !important; }
  .naowee-message__title { margin: 0 0 2px !important; }
  .naowee-message__text  { margin: 0 !important; }

  /* ── v1.5.7: Trigger de Dirección (estilo igual al textfield wrap canónico) ── */
  .ivc-direccion-trigger {
    width: 100%;
    text-align: left;
    cursor: pointer;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .ivc-direccion-trigger:hover {
    border-color: var(--naowee-color-interactive-border-hover, #8788ab) !important;
  }
  .ivc-direccion-trigger__placeholder {
    color: var(--naowee-color-text-secondary, #646587);
    font-weight: 400;
    flex: 1;
  }
  .ivc-direccion-trigger__value {
    color: var(--text-primary);
    flex: 1;
  }
  .ivc-direccion-trigger__icon {
    color: var(--naowee-color-text-secondary, #646587);
    display: inline-flex;
    flex-shrink: 0;
  }
  .ivc-direccion-trigger:hover .ivc-direccion-trigger__icon { color: var(--accent); }

  /* ── v1.5.7: Modal de Dirección (markup canónico DS Naowee) ── */
  .ivc-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  .ivc-modal-overlay.is-open { opacity: 1; pointer-events: auto; }
  .ivc-modal {
    background: #fff;
    border-radius: 20px;
    width: 100%; max-width: 720px;
    max-height: 90vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    transform: scale(.96);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  .ivc-modal-overlay.is-open .ivc-modal { transform: scale(1); }
  .ivc-modal__header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 26px 18px;
    border-bottom: 1px solid var(--border);
  }
  .ivc-modal__header h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--text-primary); }
  /* v1.5.8: el dismiss usa la clase canónica DS .naowee-modal__dismiss
     (estados hover ya provistos por el DS — no hace falta override). */
  .ivc-modal__body {
    padding: 22px 26px;
    overflow-y: auto;
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .ivc-modal__footer {
    padding: 16px 26px 20px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px;
  }
  /* El dropdown usa portal (escapa al body) — no necesitamos overflow:visible. */

  /* Cards de documento (lista de cargas paso 6) */
  .ivc-doc-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    background: #fff;
    margin-bottom: 14px;
  }
  .ivc-doc-card__head {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 10px;
  }
  .ivc-doc-card__title {
    font-size: 14px; font-weight: 600; color: var(--text-primary);
    margin: 0;
  }
  .ivc-doc-card__desc {
    font-size: 12.5px; color: var(--text-secondary);
    margin: 2px 0 0;
  }

  /* ============================================================
     FIX #6 — Datepicker canónico (clases scoped no-DS para vistas
     months/years que no están en design-system.css). Doug 23/05/2026.
     ============================================================ */
  .naowee-datepicker__month-selector {
    background: transparent !important;
    border: none !important;
    padding: 4px 8px;
    border-radius: 8px;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background .12s;
  }
  .naowee-datepicker__month-selector:hover,
  .naowee-datepicker__month-selector:focus-visible {
    background: var(--naowee-color-interactive-fill-quiet-idle, #fff3e6) !important;
    outline: none;
  }
  .naowee-datepicker-field__clear[hidden] {
    display: none !important;
  }
  /* Vistas months/years del calendario (no están en el DS) */
  .dp-view--months,
  .dp-view--years {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 8px;
  }
  .dp-cell {
    padding: 12px 6px;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
    transition: background .12s;
  }
  .dp-cell:hover { background: var(--naowee-color-interactive-fill-mute-hover, #f4f5f9); }
  .dp-cell--selected {
    background: var(--naowee-color-interactive-fill-loud-idle, #d74009) !important;
    color: white !important;
    font-weight: 600;
  }
  /* Datepicker popover portaled — necesita fixed positioning para escapar containers */
  .naowee-datepicker--popover {
    position: fixed;
    z-index: 9999;
  }
  .naowee-datepicker-field__value.is-placeholder {
    color: var(--text-secondary);
  }
  /* FIX #3 (23/05/2026): cursor pointer en el input del datepicker + ícono/chevron
     en naranja al hover (mismo patrón que v2.0.3 shared/modal-convocatoria.js:414). */
  .naowee-datepicker-field__input {
    cursor: pointer;
  }
  .naowee-datepicker-field__input:hover .naowee-datepicker-field__icon,
  .naowee-datepicker-field__input:hover .naowee-datepicker-field__chevron {
    color: var(--naowee-color-text-accent, #d74009);
  }
  .naowee-datepicker-field--active .naowee-datepicker-field__icon,
  .naowee-datepicker-field--active .naowee-datepicker-field__chevron {
    color: var(--naowee-color-text-accent, #d74009);
  }

  /* Tablas repeatable */
  .ivc-repeatable {
    border: 1px solid var(--border);
    border-radius: 12px;
    /* overflow visible para que el .naowee-dropdown__menu pueda
       desbordar la fila sin ser clipped por el contenedor */
    overflow: visible;
    background: #fff;
  }
  /* Dropdown inline en filas repetibles: ancho 100%, mismo look que ivc-mini-input.
     `.ivc-dropdown--inline` es scope custom IVC, NO del DS canónico (el DS solo define
     .naowee-dropdown sin variante --inline). Lo usamos junto a .naowee-dropdown. */
  .ivc-repeatable__row .ivc-dropdown--inline { width: 100%; }
  .ivc-repeatable__row .ivc-dropdown--inline .naowee-dropdown__menu {
    /* Permite el menú flotante por encima de filas siguientes */
    z-index: 1000;
  }
  .ivc-repeatable__head,
  .ivc-repeatable__row {
    display: grid;
    gap: 10px;
    padding: 12px 14px;
    align-items: center;
  }
  /* v1.5.8 (25/05/2026): forzar min-width:0 + ellipsis en celdas del grid para
     que ningún input/dropdown/datepicker crezca por encima del width del col.
     Feedback Juanma: el "Extraordinaria con carácter de Ordinaria" y las fechas
     largas hacían crecer las celdas y rompían la grilla.
     Sin min-width:0 los flex/grid children por default crecen con el contenido. */
  .ivc-repeatable__row > * { min-width: 0; }
  .ivc-repeatable__row .naowee-dropdown__value,
  .ivc-repeatable__row .naowee-dropdown__placeholder,
  .ivc-repeatable__row .naowee-datepicker-field__value {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
    min-width: 0;
  }
  .ivc-repeatable__head {
    background: #fafbff;
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .3px;
    /* v1.5.7: redondear top corners para no romper el border-radius del wrapper.
       Feedback Doug: las cajas parecían "romperse" en las esquinas. */
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
  }
  .ivc-repeatable__row + .ivc-repeatable__row { border-top: 1px dashed var(--border); }
  /* v1.5.7 (25/05/2026): mini inputs alineados al DS canónico Naowee.
     Antes: radius 6, height 36, padding 0 10, font 13.
     Ahora: radius 8 (= --radius-md), height 40, padding 0 12, font 14 (= --text-base).
     Feedback Doug: parecían hardcodeados, diferentes al resto del DS. */
  .ivc-repeatable__row input.ivc-mini-input,
  .ivc-repeatable__row select.ivc-mini-input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--border-dark);
    border-radius: var(--radius-md, 8px);
    font-family: inherit;
    font-size: var(--text-base, 14px);
    color: var(--text-primary);
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .ivc-repeatable__row input.ivc-mini-input::placeholder {
    color: var(--text-secondary);
    font-weight: 400;
  }
  .ivc-repeatable__row input.ivc-mini-input:focus,
  .ivc-repeatable__row select.ivc-mini-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(215,64,9,.15);
  }
  /* FIX #5 (23/05/2026): datepicker canónico en filas repeatable.
     Usa la variante --small del DS ajustada para encajar en
     la altura visual del ivc-mini-input.
     v1.5.7: subido a 40px / radius 8 / padding 0 12 para matchear el mini-input
     alineado al DS canónico. Feedback Doug. */
  .ivc-repeatable__row .naowee-datepicker-field { width: 100%; }
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__input {
    height: 40px;
    padding: 0 12px;
    border-radius: var(--radius-md, 8px);
    border-color: var(--border-dark);
  }
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__icon,
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__icon svg {
    width: 16px; height: 16px;
  }
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__chevron,
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__chevron svg {
    width: 14px; height: 14px;
  }
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__clear,
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__clear svg {
    width: 14px; height: 14px;
  }
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__value {
    font-size: 12px;
  }
  .ivc-repeatable__row-display {
    font-size: 12.5px; font-weight: 600; color: var(--text-primary);
  }
  /* FIX #6 (23/05/2026): el botón de borrar fila usa el componente canónico
     .naowee-btn--quiet (stroke accent + naranja en hover) — esta clase solo
     ajusta el width del icono dentro del grid del repeatable. */
  .ivc-repeatable__row .ivc-repeatable__remove,
  .ivc-repeatable__row .naowee-btn--icon.naowee-btn--small.ivc-repeatable__remove {
    width: 32px;
    justify-self: center;
  }
  .ivc-repeatable__remove[disabled] { opacity: .35; cursor: not-allowed; }
  .ivc-repeatable__add {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: #fafbff;
    /* FIX #7: CTA "+ Agregar fila" alineado a la izquierda (Doug 23/05/2026) */
    text-align: left;
    /* v1.5.7: redondear bottom corners para no romper el border-radius del wrapper. */
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
  }
  /* v1.5.7: el botón "+ Agregar fila" usa --mute (ghost) en lugar de --quiet
     (que pintaba background crema). Feedback Doug. Aplica scoped al CTA del
     wrapper repeatable para no afectar otros --quiet del formulario. */
  .ivc-repeatable__add .naowee-btn--mute {
    background: transparent;
    color: var(--accent);
    padding-left: 0;
    padding-right: 12px;
  }
  .ivc-repeatable__add .naowee-btn--mute:hover {
    background: var(--accent-bg, #fff3e6);
    padding-left: 12px;
  }

  /* ═══ v1.13.58 (Doug 27/05/2026): en mobile las tablas repeatable de muchas
     columnas (ej. Asamblea: 5 cols) se "revientan". UX Pro Max: cada fila se
     convierte en una CARD apilada con campos full-width, cada uno con su label
     (tomado del header de columna via data-label, inyectado por
     labelRepeatableCells() tras cada render). ═══ */
  @media (max-width: 640px) {
    /* Header de columnas oculto — los labels viven en cada campo. */
    .ivc-repeatable__head { display: none !important; }
    /* v1.13.59: el contenedor exterior pierde su caja (border/radius/bg) para
       NO anidar "caja dentro de caja"; cada REGISTRO es una card independiente. */
    .ivc-repeatable {
      counter-reset: ivc-rrow;
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      overflow: visible !important;
    }
    .ivc-repeatable__row {
      display: block !important;
      grid-template-columns: none !important;
      padding: 16px !important;
      position: relative;
      border: 1px solid var(--border) !important;
      border-radius: 14px !important;
      background: #fff !important;
      margin: 0 0 12px !important;
    }
    .ivc-repeatable__row::before {
      counter-increment: ivc-rrow;
      content: "Registro " counter(ivc-rrow);
      display: block;
      font-size: 11px; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: 14px;
    }
    /* Cada celda full-width apilada. */
    .ivc-repeatable__row > * {
      display: block !important;
      width: 100% !important;
      min-width: 0 !important;
      margin: 0 0 14px !important;
    }
    .ivc-repeatable__row > *:last-child { margin-bottom: 0 !important; }
    /* Label de columna sobre el campo (dropdowns/datepickers soportan ::before;
       los <input> usan su placeholder, que ya es descriptivo). */
    .ivc-repeatable__row > [data-label]:not([data-label=""])::before {
      content: attr(data-label);
      display: block;
      font-size: 12px; font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    /* Botón eliminar → acción en la esquina superior derecha de la card. */
    .ivc-repeatable__row .ivc-repeatable__remove {
      position: absolute !important;
      top: 12px !important; right: 12px !important;
      width: 34px !important; height: 34px !important;
      margin: 0 !important; justify-self: auto !important;
    }
    /* Mini-inputs/dropdowns/datepickers más altos para tap cómodo. */
    .ivc-repeatable__row input.ivc-mini-input,
    .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__input {
      height: 46px !important;
    }
    /* "+ Agregar fila": link standalone (el contenedor ya no es una caja). */
    .ivc-repeatable__add {
      border-top: 0 !important;
      background: transparent !important;
      border-radius: 0 !important;
      padding: 2px 0 0 !important;
    }
  }

  /* Resumen final (paso 7) */
  .wz-review { display: grid; gap: 14px; }
  .wz-review__group {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    background: #fbfbfd;
  }
  .wz-review__group-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .wz-review__row {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 12px;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px dashed var(--border);
  }
  .wz-review__row:last-child { border-bottom: 0; }
  .wz-review__label { color: var(--text-secondary); font-weight: 500; }
  .wz-review__value { color: var(--text-primary); font-weight: 600; word-break: break-word; }
  @media (max-width: 640px) {
    .wz-review__row { grid-template-columns: 1fr; gap: 2px; }
  }

  /* FIX #7 (23/05/2026): Pantalla de éxito con confetti + congrats portada del
     módulo de Incentivos (naowee-test-incentivos/incentivo-11-asignar-exito.html
     líneas 16-63 + 321-334). Clases custom no-DS (scoped a la pantalla de éxito):
     .success-wrap, .success-hero, .success-check, .success-stamp, .confetti,
     .receipt, .kv-row — mismo lenguaje visual que Incentivos.

     v1.4.2 (23/05/2026): el banner de estado migrado de .status-banner custom
     a .naowee-message--informative canónico. Comprobante refactorizado con
     íconos por row + jerarquía + highlight del Plazo + Estado como badge. */
  .success-wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 0 28px;
    animation: fadeInUp .4s cubic-bezier(.4,0,.2,1);
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .success-hero {
    background: linear-gradient(180deg, #fff 0%, #fafbfd 100%);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .success-hero::before {
    content: "";
    position: absolute;
    top: -40px; left: 50%; transform: translateX(-50%);
    width: 280px; height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(31,137,35,.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .success-check {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #25a12a, #1f8923);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff;
    margin-bottom: 18px;
    box-shadow: 0 8px 28px rgba(31,137,35,.35);
    animation: successPop .5s cubic-bezier(.34,1.56,.64,1);
    position: relative; z-index: 1;
  }
  @keyframes successPop {
    0%   { transform: scale(.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .success-hero h1 {
    font-size: 28px; font-weight: 800; letter-spacing: -.02em;
    margin: 0 0 8px;
    position: relative; z-index: 1;
    color: var(--text-primary);
  }
  .success-hero p {
    font-size: 14px; color: var(--text-secondary);
    line-height: 1.5;
    max-width: 480px; margin: 0 auto;
    position: relative; z-index: 1;
  }
  .success-stamp {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px;
    font-family: var(--font-sans);font-variant-numeric:tabular-nums;
    font-size: 11.5px; font-weight: 700;
    color: var(--text-secondary);
    padding: 5px 12px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 9999px;
    position: relative; z-index: 1;
  }
  /* Confetti */
  .confetti {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 0;
  }
  .confetti span {
    position: absolute;
    width: 8px; height: 12px;
    animation: confettiFall 2.4s linear forwards;
    opacity: 0;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-30px) rotate(0); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: translateY(280px) rotate(720deg); opacity: 0; }
  }
  /* Doug 23/05/2026: spacing custom para el .naowee-message canónico
     en el contexto de la pantalla success (no override de la clase DS) */
  .success-wrap > .naowee-message { margin-bottom: 18px; }
  /* Comprobante / receipt */
  .receipt {
    border: 1px solid var(--border);
    border-radius: 16px;
    background: #fff;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .receipt__head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: #fbfbfd;
  }
  .receipt__head h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--text-primary); letter-spacing: -.01em; }
  .receipt__id {
    font-family: var(--font-sans);font-variant-numeric:tabular-nums;
    font-size: 12px; font-weight: 700; color: var(--accent);
    padding: 4px 10px;
    background: var(--orange-bg, #fff3e6);
    border: 1px solid var(--orange-border, #ffbf75);
    border-radius: 9999px;
  }
  .receipt__body {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .receipt__ava {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, #FF7500, #d74009);
    color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800;
    flex-shrink: 0;
    letter-spacing: -.01em;
  }
  .receipt__person { flex: 1; min-width: 0; }
  .receipt__person-name { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 2px; }
  .receipt__person-meta { font-size: 12.5px; color: var(--text-secondary); }
  /* Doug 23/05/2026: refactor del comprobante con jerarquía + íconos.
     Patrón del módulo Incentivos (asignar-exito) aplicado a IVC. */
  .receipt__details {
    padding: 8px 18px 16px;
    display: flex; flex-direction: column;
  }
  .kv-row {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .kv-row:last-child { border-bottom: 0; }
  .kv-row__ico {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: #f5f6fa;
    color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .kv-row__ico svg { width: 20px; height: 20px; }
  .kv-row__main {
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0;
  }
  .kv-row__label {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .kv-row__value {
    font-size: 14px;
    color: var(--text-primary);
    font-weight: 700;
    word-break: break-word;
  }
  .kv-row__hint {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 400;
    margin-top: 2px;
  }
  .kv-row__aside { flex-shrink: 0; }
  /* Highlight: row destacado (Plazo de respuesta) */
  .kv-row--highlight .kv-row__ico {
    background: var(--orange-bg, #fff3e6);
    color: var(--accent, #d74009);
  }
  .kv-row--highlight .kv-row__value {
    color: var(--accent, #d74009);
    font-size: 15px;
  }
  @media (max-width: 640px) {
    .kv-row { grid-template-columns: 36px 1fr; gap: 12px; }
    .kv-row__aside { grid-column: 1 / -1; padding-left: 48px; }
  }
  .success-actions {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    margin-top: 4px;
  }

  /* Success view legacy (mantener compat con renderSuccess antiguo si se usa en otro lado) */
  .wz-success {
    position: relative;
    text-align: center;
    padding: 56px 32px;
    overflow: hidden;
  }

  /* Skip view (paso no aplica para asociaciones) */
  .ivc-skip-view { padding: 48px 32px; text-align: center; }
  .ivc-skip-view svg { color: var(--text-secondary); margin-bottom: 12px; }
  .ivc-skip-view h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; color: var(--text-primary); }
  .ivc-skip-view p { color: var(--text-secondary); font-size: 13.5px; margin: 0; }

  /* Counter para textarea */
  .ivc-counter {
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--text-secondary);
    text-align: right;
  }

  /* Spacing default para .naowee-message embebido */
  .wz-step-panel > .naowee-message { margin-bottom: 18px; }

</style>
</head>

<body>

<!-- ============================================================
     HEADER · Ministerio + SUID + Naowee
     ============================================================ -->
<header class="ivc-top-header">
  <div class="ivc-top-header__brand">
    <div class="ivc-top-header__logos">
      <img class="l-min" src="logos/ministerio.svg" alt="Ministerio del Deporte" onerror="this.style.display='none'"/>
      <div class="ivc-top-header__sep"></div>
      <img class="l-suid" src="logos/suid.png" alt="SUID — Sistema Único de Información del Deporte" onerror="this.style.display='none'"/>
    </div>
    <div class="ivc-top-header__title-wrap">
      <div class="ivc-top-header__title">Trámite IVC · Reconocimiento Deportivo</div>
      <div class="ivc-top-header__subtitle">Inspección, Vigilancia y Control</div>
    </div>
  </div>
  <div class="ivc-top-header__meta">
    <!-- v1.13.56 (Doug 27/05/2026) #1: solo imagotipo de naowee (sin wordmark) -->
    <img class="l-naowee" src="logos/naowee-icon.svg" alt="Naowee" onerror="this.style.display='none'"/>
  </div>
</header>

<!-- ============================================================
     PAGE
     ============================================================ -->
<main class="wz-page">

  <div class="wz-page__header">
    <h1 class="wz-page__title">Radicación de trámite</h1>
    <p class="wz-page__subtitle">Otorgamiento de Reconocimiento Deportivo · Diligencie los pasos siguientes para radicar la solicitud.</p>
  </div>

  <article class="wz-card">

    <!-- Stepper desktop -->
    <div class="wz-stepper-wrap" id="stepperWrap">
      <div class="naowee-stepper naowee-stepper--pulse naowee-stepper--distributed" id="stepperDesktop" role="list">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Stepper mobile -->
    <div class="wz-stepper-mobile" id="stepperMobile"></div>

    <!-- Body -->
    <div class="wz-body" id="wzBody"></div>

    <!-- Footer -->
    <div class="wz-footer">
      <!-- v1.5.7: btnBack pasa a --mute (ghost transparent + hover sutil) en
           lugar de --quiet (fill naranja claro). Feedback Doug. -->
      <button type="button" class="naowee-btn naowee-btn--mute naowee-btn--large" id="btnBack">← Anterior</button>
      <button type="button" class="naowee-btn naowee-btn--loud naowee-btn--large" id="btnNext">Continuar →</button>
    </div>

  </article>
</main>

<!-- v1.5.7 (25/05/2026): Modal de Dirección estructurado (feedback Juanma).
     Patrón: SUID — campos separados para reducir ambigüedad. -->
<div class="ivc-modal-overlay" id="ivcDireccionModal" role="dialog" aria-modal="true" aria-labelledby="ivcDireccionTitle" onclick="if(event.target===this)cerrarModalDireccion()">
  <div class="ivc-modal">
    <header class="ivc-modal__header">
      <h2 id="ivcDireccionTitle">Dirección</h2>
      <!-- v1.5.8 (25/05/2026): dismiss canónico DS (.naowee-modal__dismiss).
           Feedback Doug: estados de interactividad correctos del DS. -->
      <button type="button" class="naowee-modal__dismiss" onclick="cerrarModalDireccion()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="ivc-modal__body" id="ivcDireccionBody"></div>
    <!-- v1.5.8: removido "Cancelar" (feedback Doug: redundante con X + click en overlay). -->
    <footer class="ivc-modal__footer">
      <button type="button" class="naowee-btn naowee-btn--loud naowee-btn--large" id="btnGuardarDireccion" disabled onclick="guardarDireccion()">Guardar</button>
    </footer>
  </div>

/* v1.5.7 (25/05/2026): Stepper dinámico según tipo de organismo (feedback Juanma).
   Antes el stepper siempre mostraba los 7 pasos y la lógica de next()/prev()
   "saltaba" el paso de Asamblea para Asociaciones, generando el salto visual
   3 → 5 que confundía al usuario. Ahora el stepper itera solo sobre los
   pasos aplicables y la numeración "Paso N de M" usa el índice visual continuo.

   STATE.step sigue siendo el índice ABSOLUTO del array STEPS (0-6) para no
   romper la lógica interna ni los switch(STATE.step) — solo cambia cómo se
   PRESENTA. Para agregar un nuevo organismo, basta con sumar una entrada acá. */
const STEPS_POR_ORGANISMO = {
  liga:       [0, 1, 2, 3, 4, 5, 6],         // 7 pasos · todos aplican
  asociacion: [0, 1, 2,    4, 5, 6],         // 6 pasos · sin Asamblea (idx 3)
  federacion: [0, 1, 2, 3, 4, 5, 6],         // 7 pasos · todos aplican
};

function pasosAplicables() {
  // v1.13.54 (Juanma 27/05/2026): el NÚMERO de pasos lo determina el tipo de
  // organismo, así que NO mostramos la secuencia completa hasta elegirlo.
  // Antes de seleccionar, el stepper muestra solo "Pre-selección" (idx 0) y
  // los pasos restantes se revelan al elegir el organismo (render() en el
  // onChange del dropdown). Evita prometer 7 pasos cuando una Asociación tiene 6.
  if (!STATE.tipoOrganismo) return [0];
  return STEPS_POR_ORGANISMO[STATE.tipoOrganismo] || STEPS.map((_, i) => i);
}

function indiceVisual(stepIdx) {
  return pasosAplicables().indexOf(stepIdx);
}

   paso 0, y solo se pisa el valor previo si está vacío o si coincide con otro
   de estos ejemplos canónicos (no se borra lo que el usuario tipeó a mano). */
const EJEMPLOS_POR_ORGANISMO = {
  liga: {
    nombre: 'Liga de Atletismo de Antioquia',
    nit:    '800123456-7' // las ligas departamentales sí manejan NIT como persona jurídica

  asociacion: {
    nombre: 'Asociación Juvenil Deportiva de Cundinamarca',

  },
  federacion: {
    nombre: 'Federación Colombiana de Fútbol',
    nit:    '' // las federaciones no manejan NIT en este trámite
  }
};

function aplicarEjemploOrganismo(orgId) {
  const ejemplo = EJEMPLOS_POR_ORGANISMO[orgId];
  if (!ejemplo) return;
  // Solo pisamos el valor si está vacío o si coincide con OTRO ejemplo canónico.
  // Esto evita borrar lo que el usuario ya tipeó manualmente.
  const ejemplosNombre = Object.values(EJEMPLOS_POR_ORGANISMO).map(e => e.nombre);
  const nombreActual = (STATE.data.nombre || '').trim();
  if (!nombreActual || ejemplosNombre.includes(nombreActual)) {
    STATE.data.nombre = ejemplo.nombre;
  }
  // NIT: igual lógica. Si pasamos a Asociación/Federación, queda en '' y el
  // campo ni siquiera se renderiza (ver renderStep1 / validateStep1).
  const ejemplosNit = Object.values(EJEMPLOS_POR_ORGANISMO).map(e => e.nit).filter(Boolean);
  const nitActual = (STATE.data.nit || '').trim();
  if (!nitActual || ejemplosNit.includes(nitActual)) {
    STATE.data.nit = ejemplo.nit;
  }
}

/* ============================================================
   Helpers
   ============================================================ */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return esc(s); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function dispValue(v) { return v && String(v).trim() ? esc(v) : '<span style="color:var(--text-secondary);font-style:italic">(no diligenciado)</span>'; }

function isStepApplicable(idx) {
  // v1.5.7: ahora derivado de STEPS_POR_ORGANISMO. Para agregar excepciones
  // por organismo, editar el mapa arriba — no esta función.
  return pasosAplicables().includes(idx);
}

function fileSizeFmt(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return Math.round(n/1024) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}

function getStateAtPath(path) {
  const parts = path.split('.');
  let cur = STATE;
  for (const p of parts) { if (cur == null) return null; cur = cur[p]; }
  return cur;
}
function setStateAtPath(path, val) {
  const parts = path.split('.');
  let cur = STATE;
  for (let i = 0; i < parts.length - 1; i++) {
    if (cur[parts[i]] == null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = val;
}
function clearStateAtPath(path) { setStateAtPath(path, null); }

function mockUpload(input, statePath) {
  const f = input.files && input.files[0];
  if (!f) return;
  setStateAtPath(statePath, { name: f.name, size: fileSizeFmt(f.size) });
  render();
}

// Textfield canónico .naowee-textfield
/* v1.5.7 (25/05/2026): Máscaras de entrada por tipo de campo (feedback Juanma).
   - opts.mask: 'tel' (solo dígitos, +, espacios), 'numeric' (solo dígitos),
                'money' (numérico con miles), 'email' (sin spaces), 'alpha' (sin números).
   - opts.maxLength: cap del input.
   Se aplica vía función de saneo en cada input. Se ejecuta ANTES del onInput
   del caller para que el STATE solo reciba el valor saneado. */
function applyMask(maskType, raw) {
  if (!raw) return '';
  switch (maskType) {
    case 'tel':
      // Permite dígitos, +, espacios, paréntesis y guiones (formato colombiano).
      return String(raw).replace(/[^0-9+\-()\s]/g, '');
    case 'numeric':
      return String(raw).replace(/[^0-9]/g, '');
    case 'money':
      // Solo dígitos. El formato con puntos se aplica en display, no en input.
      // (Si quisiéramos format-on-type, dispararía conflicts con caret position.)
      return String(raw).replace(/[^0-9]/g, '');
    case 'email':
      // Permitimos solo caracteres válidos de email. No spaces.
      return String(raw).replace(/\s/g, '').toLowerCase();
    case 'alpha':
      // Letras (incluye acentos y ñ) + espacios. Sin dígitos.
      return String(raw).replace(/[0-9]/g, '');
    default:
      return String(raw);
  }
}

function tf(opts) {
  const id = opts.id || ('tf-' + Math.random().toString(36).slice(2,8));
  const label = opts.label || '';
  const required = !!opts.required;
  const value = opts.value || '';
  const placeholder = opts.placeholder || '';
  const type = opts.type || 'text';
  const onInput = opts.onInput || '';
  const mask = opts.mask || '';
  const maxLength = opts.maxLength || '';
  const helper = opts.helper || '';
  const error = opts.error || '';
  const variant = error ? ' naowee-textfield--error' : '';
  // Si hay mask, envolvemos el onInput original para sanear el valor primero.
  const inputHandler = mask
    ? `this.value=applyMask('${mask}',this.value);${onInput}`
    : onInput;
  // inputmode mejora el teclado en mobile y la accesibilidad.
  const inputMode = mask === 'tel' ? ' inputmode="tel"'
                  : mask === 'numeric' || mask === 'money' ? ' inputmode="numeric"'
                  : mask === 'email' ? ' inputmode="email"' : '';
  const maxAttr = maxLength ? ` maxlength="${maxLength}"` : '';
  return `
    <div class="naowee-textfield${variant}" data-tf-id="${id}">
      <label class="naowee-textfield__label${required ? ' naowee-textfield__label--required' : ''}" for="${id}">${esc(label)}</label>
      <div class="naowee-textfield__input-wrap">
        <input class="naowee-textfield__input" id="${id}" type="${type}"${inputMode}${maxAttr} placeholder="${escAttr(placeholder)}" value="${escAttr(value)}" oninput="${inputHandler}" />
      </div>
      ${helper ? `<span class="naowee-textfield__helper" style="font-size:11.5px;color:var(--text-secondary);margin-top:6px;display:block;">${esc(helper)}</span>` : ''}
      ${error ? helperNegative(error) : ''}
    </div>
  `;
}

   v1.5.7 (25/05/2026): Modal de Dirección estructurado (feedback Juanma).
   Reemplaza el textfield libre por un trigger que abre un modal con campos
   separados: Tipo de vía + Número + Letra + BIS + Cruce + Casa + Info.
   Se inspira en el patrón del SUID (imagen compartida por Juanma).

const TIPOS_VIA = [
  { v:'',         t:'Seleccionar' },
  { v:'calle',    t:'Calle' },
  { v:'carrera',  t:'Carrera' },
  { v:'diagonal', t:'Diagonal' },
  { v:'avenida',  t:'Avenida' },
  { v:'transversal', t:'Transversal' },
  { v:'autopista',   t:'Autopista' }
];

const LETRAS_VIA = [
  { v:'', t:'Ninguna' },
  ...'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('').map(L => ({ v:L, t:L }))
];

function ensureDireccionStruct() {
  if (!STATE.data.direccionEstructurada) {
    STATE.data.direccionEstructurada = {
      tipoVia:'', numero:'', letra:'', bis:false,
      numeroCruce:'', letraCruce:'',
      numeroCasa:'', info:''
    };
  }
  return STATE.data.direccionEstructurada;
}

function formatearDireccion(d) {
  if (!d) return '';
  const tipoLabel = (TIPOS_VIA.find(t => t.v === d.tipoVia) || {}).t || '';
  if (!tipoLabel || !d.numero) return '';
  let s = `${tipoLabel} ${d.numero}`;
  if (d.letra) s += d.letra;
  if (d.bis) s += ' Bis';
  if (d.numeroCruce) {
    s += ` # ${d.numeroCruce}`;
    if (d.letraCruce) s += d.letraCruce;
  }
  if (d.numeroCasa) s += `-${d.numeroCasa}`;
  if (d.info) s += `, ${d.info}`;
  return s;
}

function direccionTrigger(opts) {
  const id = opts.id || 'f-dir-trigger';
  const required = !!opts.required;
  const value = opts.value || '';
  return `
    <div class="naowee-textfield" data-tf-id="${id}">
      <label class="naowee-textfield__label${required ? ' naowee-textfield__label--required' : ''}" for="${id}">Dirección</label>
      <button type="button" class="naowee-textfield__input-wrap ivc-direccion-trigger" id="${id}" onclick="abrirModalDireccion()">
        ${value
          ? `<span class="ivc-direccion-trigger__value">${esc(value)}</span>`
          : `<span class="ivc-direccion-trigger__placeholder">Diligencie la dirección</span>`}
        <span class="ivc-direccion-trigger__icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </span>
      </button>
    </div>
  `;
}

function abrirModalDireccion() {
  ensureDireccionStruct();
  document.getElementById('ivcDireccionModal').classList.add('is-open');
  document.body.style.overflow = 'hidden';
  renderModalDireccionBody();
}

function cerrarModalDireccion() {
  document.getElementById('ivcDireccionModal').classList.remove('is-open');
  document.body.style.overflow = '';
}

function guardarDireccion() {
  const d = ensureDireccionStruct();
  // Validar mínimos: tipo de vía + número
  if (!d.tipoVia || !d.numero) {
    // El botón Guardar ya está disabled, pero por defensa:
    return;
  }
  STATE.data.direccion = formatearDireccion(d);
  cerrarModalDireccion();
  render();
}

  const d = ensureDireccionStruct();

      ${tf({ id:'dir-num', label:'Número', required:true,

      ${dd({ id:'dir-letracruce', label:'Letra de cruce',

      ${tf({ id:'dir-info', label:'Información adicional',

  refrescarBtnGuardarDireccion();

// Dropdown — componente canónico .naowee-dropdown del DS Naowee v1.8.0
// El JS controlador está al final del archivo (initDropdowns)
// Opciones soportadas por entrada: { v, t, disabled? }
function dd(opts) {
  const id = opts.id || ('dd-' + Math.random().toString(36).slice(2,8));
  const label = opts.label || '';
  const required = !!opts.required;
  const value = opts.value || '';
  const options = opts.options || [];
  // onChange recibe el valor seleccionado. Se invoca desde el controlador
  // simulando un input con .value (compatibilidad con strings tipo "STATE.x=this.value")
  const onChange = opts.onChange || '';
  // Encuentra placeholder (option con v='') y opción seleccionada
  const placeholderOpt = options.find(o => o.v === '');
  const placeholderText = placeholderOpt ? placeholderOpt.t : 'Seleccione…';
  const selectedOpt = options.find(o => o.v === value && o.v !== '');
  const hasValue = !!selectedOpt;
  // Filtra placeholder fuera del menú visible (DS usa el placeholder en el trigger, no como opción)
  const menuOptions = options.filter(o => o.v !== '');
  return `
    <div class="naowee-dropdown" id="${id}-wrap" data-dd-id="${id}"${required ? ' data-required="true"' : ''} data-on-change="${escAttr(onChange)}">
      <label class="naowee-dropdown__label${required ? ' naowee-dropdown__label--required' : ''}">${esc(label)}</label>
      <button type="button" id="${id}" class="naowee-dropdown__trigger" aria-haspopup="listbox" aria-expanded="false">
        ${hasValue
          ? `<span class="naowee-dropdown__value">${esc(selectedOpt.t)}</span>`
          : `<span class="naowee-dropdown__placeholder">${esc(placeholderText)}</span>`}
        <div class="naowee-dropdown__controls">
          <span class="naowee-dropdown__chevron">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 7.5 10 12.5 15 7.5"/></svg>
          </span>
        </div>
      </button>
      <div class="naowee-dropdown__menu" role="listbox" data-placeholder="${escAttr(placeholderText)}">
        ${menuOptions.map(o => {
          const isDisabled = !!o.disabled;
          const cls = 'naowee-dropdown__option'
            + (o.v === value ? ' naowee-dropdown__option--selected' : '')
            + (isDisabled ? ' naowee-dropdown__option--disabled' : '');
          const ariaDisabled = isDisabled ? ' aria-disabled="true"' : '';
          return `<div class="${cls}" role="option" data-value="${escAttr(o.v)}" tabindex="-1"${ariaDisabled}>${esc(o.t)}</div>`;
        }).join('')}
      </div>
    </div>
  `;
}

                <span class="naowee-datepicker__weekday">Mié</span>
                <span class="naowee-datepicker__weekday">Jue</span>
                <span class="naowee-datepicker__weekday">Vie</span>
                <span class="naowee-datepicker__weekday">Sab</span>
                <span class="naowee-datepicker__weekday">Dom</span>
              </div>
              <div class="naowee-datepicker__days"></div>

            <div class="dp-view dp-view--months" hidden></div>

      </div>
      ${helper ? `<div class="naowee-helper"><span class="naowee-helper__text"><span>${esc(helper)}</span></span></div>` : ''}
    </div>
  `;
}

// Reutiliza el mismo flujo + bindDatepickers(), pero usa .naowee-datepicker-field--small
// del DS para encajar en filas estrechas (~140-160px de ancho, h:36px).
// Sin label visible (la columna del header del repeatable ya identifica el campo).

  const clearIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

      <div class="naowee-datepicker-field__input" tabindex="0" role="button" aria-haspopup="dialog" aria-expanded="false">

        <div class="naowee-datepicker-field__controls">

      <input type="hidden" name="${escAttr(name)}" value="${escAttr(value)}"/>

        <div class="naowee-datepicker__calendar" data-mode="days">

              </button>
              <button type="button" class="naowee-datepicker__nav" data-nav="1" aria-label="Siguiente">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg>
              </button>

                <span class="naowee-datepicker__weekday">Mar</span>
                <span class="naowee-datepicker__weekday">Mié</span>
                <span class="naowee-datepicker__weekday">Jue</span>
                <span class="naowee-datepicker__weekday">Vie</span>
                <span class="naowee-datepicker__weekday">Sab</span>
                <span class="naowee-datepicker__weekday">Dom</span>
              </div>

function formatDateLong(d) {
  return `${d.getDate()} de ${MESES_ES[d.getMonth()]} de ${d.getFullYear()}`;
}

function buildDaysHTML(viewYear, viewMonth, selectedISO) {
  const selected = selectedISO ? new Date(selectedISO) : null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const first = new Date(viewYear, viewMonth, 1);
  let firstDow = first.getDay() - 1; if (firstDow < 0) firstDow = 6;
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrev = new Date(viewYear, viewMonth, 0).getDate();

  let html = '';
  for (let w = 0; w < 6; w++) {
    html += '<div class="naowee-datepicker__week">';
    for (let d = 0; d < 7; d++) {
      const i = w * 7 + d;
      let dayNum, isOther = false, year = viewYear, month = viewMonth;
      if (i < firstDow) {
        dayNum = daysInPrev - firstDow + 1 + i;
        isOther = true;
        month = viewMonth - 1;
        if (month < 0) { month = 11; year--; }
      } else if (i >= firstDow + daysInMonth) {
        dayNum = i - firstDow - daysInMonth + 1;
        isOther = true;
        month = viewMonth + 1;
        if (month > 11) { month = 0; year++; }
      } else {
        dayNum = i - firstDow + 1;
      }
      const cellDate = new Date(year, month, dayNum);
      cellDate.setHours(0, 0, 0, 0);
      const isSelected = selected && cellDate.toDateString() === selected.toDateString();
      const isToday = cellDate.toDateString() === today.toDateString();
      const classes = [
        'naowee-datepicker__day',
        isOther ? 'naowee-datepicker__day--other-month' : '',
        isSelected ? 'naowee-datepicker__day--selected' : '',
        isToday && !isSelected ? 'naowee-datepicker__day--today' : ''
      ].filter(Boolean).join(' ');
      // ISO local format yyyy-mm-dd para evitar shift de timezone
      const iso = `${year}-${String(month + 1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      html += `<button type="button" class="${classes}" data-iso="${iso}">${dayNum}</button>`;
    }
    html += '</div>';
  }
  return html;
}

function setDatepickerValue(field, iso, dateObj) {
  field.dataset.selected = iso || '';
  const valueEl = field.querySelector('.naowee-datepicker-field__value');
  const hiddenInput = field.querySelector('input[type="hidden"][name]');
  const clearBtn = field.querySelector('.naowee-datepicker-field__clear');
  if (iso && dateObj) {
    valueEl.textContent = formatDateLong(dateObj);
    valueEl.classList.remove('is-placeholder');
    if (hiddenInput) hiddenInput.value = iso;
    if (clearBtn) clearBtn.hidden = false;
  } else {
    const placeholder = valueEl.dataset.placeholder || 'dd mmm aaaa';
    valueEl.textContent = placeholder;
    valueEl.classList.add('is-placeholder');
    if (hiddenInput) hiddenInput.value = '';
    if (clearBtn) clearBtn.hidden = true;
  }
  // Dispatch onChange — strings tipo "STATE.x=this.value"
  const onChange = field.dataset.onChange || '';
  if (onChange) {
    try {
      const literal = JSON.stringify(String(iso || ''));
      const code = onChange.replace(/this\.value/g, literal);
      new Function(code)();
    } catch(err) {
      // Silencioso — datepicker no rompe la pantalla por un onChange roto
    }
  }
  if (hiddenInput) hiddenInput.dispatchEvent(new Event('input', { bubbles: true }));
}

function renderCalendarPortal(popover, field, viewYear, viewMonth) {
  const calendar = popover.querySelector('.naowee-datepicker__calendar');
  const mode = calendar.dataset.mode || 'days';
  const monthLabel = popover.querySelector('.naowee-datepicker__month');
  const viewDays = popover.querySelector('.dp-view--days');
  const viewMonths = popover.querySelector('.dp-view--months');
  const viewYears = popover.querySelector('.dp-view--years');
  const daysWrap = popover.querySelector('.naowee-datepicker__days');

  viewDays.style.display = mode === 'days' ? '' : 'none';
  viewMonths.style.display = mode === 'months' ? 'grid' : 'none';
  viewYears.style.display = mode === 'years' ? 'grid' : 'none';
  viewDays.hidden = mode !== 'days';
  viewMonths.hidden = mode !== 'months';
  viewYears.hidden = mode !== 'years';

  const closePopover = () => {
    popover.hidden = true;
    popover.classList.remove('naowee-datepicker--open');
    field.classList.remove('naowee-datepicker-field--active');
    const inp = field.querySelector('.naowee-datepicker-field__input');
    if (inp) {
      inp.setAttribute('aria-expanded', 'false');
      inp.style.removeProperty('border-color');
      inp.style.removeProperty('box-shadow');
    }
  };

  if (mode === 'days') {
    monthLabel.textContent = `${MESES_ES[viewMonth]} ${viewYear}`;
    daysWrap.innerHTML = buildDaysHTML(viewYear, viewMonth, field.dataset.selected || '');
    daysWrap.querySelectorAll('.naowee-datepicker__day:not(.naowee-datepicker__day--disabled)').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const iso = btn.dataset.iso;
        // Parse ISO as local date (evitar shift de timezone)
        const [yy, mm, dd] = iso.split('-').map(Number);
        const d = new Date(yy, mm - 1, dd);
        setDatepickerValue(field, iso, d);
        renderCalendarPortal(popover, field, d.getFullYear(), d.getMonth());
        closePopover();
      });
    });
  }

  if (mode === 'months') {
    monthLabel.textContent = String(viewYear);
    const selectedMonth = field.dataset.selected ? new Date(field.dataset.selected).getMonth() : -1;
    const selectedYear = field.dataset.selected ? new Date(field.dataset.selected).getFullYear() : -1;
    viewMonths.innerHTML = MESES_ES_CORTO.map((m, i) => {
      const isSelected = i === selectedMonth && viewYear === selectedYear;
      return `<button type="button" class="dp-cell ${isSelected ? 'dp-cell--selected' : ''}" data-month="${i}">${m}</button>`;
    }).join('');
    viewMonths.querySelectorAll('[data-month]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const m = parseInt(btn.dataset.month);
        calendar.dataset.mode = 'days';
        renderCalendarPortal(popover, field, viewYear, m);
      });
    });
  }

  if (mode === 'years') {
    const startYear = Math.floor(viewYear / 12) * 12;
    const endYear = startYear + 11;
    monthLabel.textContent = `${startYear} - ${endYear}`;
    const selectedYear = field.dataset.selected ? new Date(field.dataset.selected).getFullYear() : -1;
    let html = '';
    for (let y = startYear; y <= endYear; y++) {
      const isSelected = y === selectedYear;
      html += `<button type="button" class="dp-cell ${isSelected ? 'dp-cell--selected' : ''}" data-year="${y}">${y}</button>`;
    }
    viewYears.innerHTML = html;
    viewYears.querySelectorAll('[data-year]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const y = parseInt(btn.dataset.year);
        calendar.dataset.mode = 'months';
        renderCalendarPortal(popover, field, y, viewMonth);
      });
    });
  }
}

function bindDatepickers(scope) {
  if (!scope) return;
  const popovers = [];
  scope.querySelectorAll('.naowee-datepicker-field').forEach(field => {
    // Si ya fue bound (post re-render), buscar el popover en body y re-bindear
    if (field._dpBound) return;
    field._dpBound = true;

    let popover = field.querySelector('.naowee-datepicker--popover');
    const inputContainer = field.querySelector('.naowee-datepicker-field__input');
    const valueEl = field.querySelector('.naowee-datepicker-field__value');
    const clearBtn = field.querySelector('.naowee-datepicker-field__clear');

    // Portal: mover popover al body (escapa overflow del wizard)
    if (popover && popover.parentElement !== document.body) {
      document.body.appendChild(popover);
    }
    field._popover = popover;
    popovers.push({ field, popover });

    let viewDate = field.dataset.selected ? new Date(field.dataset.selected) : new Date();
    if (isNaN(viewDate.getTime())) viewDate = new Date();

    const positionPopover = () => {
      const rect = inputContainer.getBoundingClientRect();
      const popoverWidth = popover.offsetWidth || 320;
      const popoverHeight = popover.offsetHeight || 320;
      const margin = 16;

      let left = rect.left;
      if (left + popoverWidth > window.innerWidth - margin) {
        left = Math.max(margin, rect.right - popoverWidth);
      }

      // Flip-up cuando no cabe debajo
      const spaceBelow = window.innerHeight - rect.bottom - margin;
      const spaceAbove = rect.top - margin;
      let top;
      if (spaceBelow >= popoverHeight + 6 || spaceBelow >= spaceAbove) {
        top = rect.bottom + 6;
        if (top + popoverHeight > window.innerHeight - margin) {
          top = Math.max(margin, window.innerHeight - margin - popoverHeight);
        }
      } else {
        top = rect.top - popoverHeight - 6;
        if (top < margin) top = margin;
      }

      popover.style.top = top + 'px';
      popover.style.left = left + 'px';
    };

    const open = () => {
      popovers.forEach(({ field: f, popover: p }) => {
        if (p !== popover) {
          p.hidden = true;
          p.classList.remove('naowee-datepicker--open');
          f.classList.remove('naowee-datepicker-field--active');
          const otherInput = f.querySelector('.naowee-datepicker-field__input');
          otherInput?.setAttribute('aria-expanded', 'false');
          if (otherInput) {
            otherInput.style.removeProperty('border-color');
            otherInput.style.removeProperty('box-shadow');
          }
        }
      });
      popover.hidden = false;
      requestAnimationFrame(() => popover.classList.add('naowee-datepicker--open'));
      field.classList.add('naowee-datepicker-field--active');
      inputContainer.setAttribute('aria-expanded', 'true');
      inputContainer.style.setProperty('border-color', '#d74009', 'important');
      inputContainer.style.setProperty('box-shadow', '0 0 0 3px rgba(215,64,9,.15)', 'important');
      const calendar = popover.querySelector('.naowee-datepicker__calendar');
      calendar.dataset.mode = 'days';
      renderCalendarPortal(popover, field, viewDate.getFullYear(), viewDate.getMonth());
      positionPopover();
      const monthSelector = popover.querySelector('.naowee-datepicker__month-selector');
      monthSelector.onclick = (e) => {
        e.stopPropagation();
        const m = calendar.dataset.mode || 'days';
        calendar.dataset.mode = m === 'days' ? 'months' : m === 'months' ? 'years' : 'days';
        renderCalendarPortal(popover, field, viewDate.getFullYear(), viewDate.getMonth());
      };
      popover.querySelectorAll('.naowee-datepicker__nav').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const dir = parseInt(btn.dataset.nav);
          const m = calendar.dataset.mode || 'days';
          if (m === 'days') {
            viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + dir, 1);
          } else if (m === 'months') {
            viewDate = new Date(viewDate.getFullYear() + dir, viewDate.getMonth(), 1);
          } else {
            viewDate = new Date(viewDate.getFullYear() + (dir * 12), viewDate.getMonth(), 1);
          }
          renderCalendarPortal(popover, field, viewDate.getFullYear(), viewDate.getMonth());
        };
      });
    };

    const close = () => {
      popover.hidden = true;
      popover.classList.remove('naowee-datepicker--open');
      field.classList.remove('naowee-datepicker-field--active');
      inputContainer.setAttribute('aria-expanded', 'false');
      inputContainer.style.removeProperty('border-color');
      inputContainer.style.removeProperty('box-shadow');
    };

    const reposition = () => { if (!popover.hidden) positionPopover(); };
    // Scope scroll: el wizard scrolea en window (no en wz-body), pero
    // si hay scrollers internos los cubrimos también.
    window.addEventListener('scroll', reposition, true);
    window.addEventListener('resize', reposition);

    const toggle = (e) => {
      e.stopPropagation();
      if (popover.hidden) open();
      else close();
    };

    inputContainer.addEventListener('click', (e) => {
      if (e.target.closest('.naowee-datepicker-field__clear')) return;
      toggle(e);
    });

    inputContainer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggle(e);
      } else if (e.key === 'Escape' && !popover.hidden) {
        close();
      }
    });

    if (clearBtn) {
      clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setDatepickerValue(field, null, null);
        viewDate = new Date();
      });
    }

    popover.addEventListener('click', (e) => e.stopPropagation());
  });

  // Click fuera cierra todos los popovers (sólo se bindea una vez global)
  if (!document._dpClickBound) {
    document._dpClickBound = true;
    document.addEventListener('click', (e) => {
      if (e.target.closest('.naowee-datepicker-field')) return;
      if (e.target.closest('.naowee-datepicker--popover')) return;
      document.querySelectorAll('body > .naowee-datepicker--popover:not([hidden])').forEach(p => {
        p.hidden = true;
        p.classList.remove('naowee-datepicker--open');
        // Buscar el field origen via data-name
        const name = p.dataset.field || '';
        // No siempre tenemos dataset.field; el match correcto es por referencia,
        // pero al portar al body perdemos eso. Como fallback, limpiamos todos
        // los fields activos en el scope visible.
        document.querySelectorAll('.naowee-datepicker-field--active').forEach(f => {
          f.classList.remove('naowee-datepicker-field--active');
          const inp = f.querySelector('.naowee-datepicker-field__input');
          if (inp) {
            inp.setAttribute('aria-expanded', 'false');
            inp.style.removeProperty('border-color');
            inp.style.removeProperty('box-shadow');
          }
        });
      });
    });
  }
}

// Radio canónico .naowee-radio
function radio(opts) {
  const name = opts.name;
  const value = opts.value;
  const checked = opts.checked === value;
  const label = opts.label || '';
  const sub = opts.sub || '';
  const onClick = opts.onClick || '';
  return `
    <label class="naowee-radio${checked ? ' naowee-radio--selected' : ''}" style="cursor:pointer;align-items:flex-start;padding:14px 16px;border:1.5px solid ${checked ? 'var(--accent)' : 'var(--border-dark)'};border-radius:8px;transition:all .15s;background:${checked ? 'var(--orange-bg)' : '#fff'};display:flex;gap:12px;" onclick="${onClick}">
      <span class="naowee-radio__circle" style="margin-top:1px;flex-shrink:0;"></span>
      <span class="naowee-radio__label" style="font-size:14px;font-weight:${sub ? '600' : '500'};">
        ${esc(label)}
        ${sub ? `<div style="margin-top:2px;font-size:12.5px;color:var(--text-secondary);font-weight:400;">${esc(sub)}</div>` : ''}
      </span>
      <input type="radio" name="${name}" value="${value}" ${checked ? 'checked' : ''} style="position:absolute;opacity:0;pointer-events:none;" />
    </label>
  `;
}

// Radio inline (Sí/No) — FIX #4 (23/05/2026): sin caja con border, solo el radio
// nativo canónico .naowee-radio (estructura del DS líneas 3875+).
function radioYN(opts) {
  const value = opts.value;
  const onYes = opts.onYes || '';
  const onNo = opts.onNo || '';
  const extra = opts.extra || [];
  const items = [
    { v:'si', t:'Sí', onClick: onYes },
    { v:'no', t:'No', onClick: onNo },
    ...extra
  ];
  return `
    <div class="naowee-radio-group naowee-radio-group--horizontal">
      ${items.map(it => {
        const selected = value === it.v;
        return `
          <label class="naowee-radio${selected ? ' naowee-radio--selected' : ''}" onclick="${it.onClick}">
            <span class="naowee-radio__circle"></span>
            <span class="naowee-radio__label">${esc(it.t)}</span>
          </label>
        `;
      }).join('')}
    </div>
  `;
}

// Checkbox canónico .naowee-checkbox
function checkbox(opts) {
  const checked = !!opts.checked;
  const label = opts.label || '';
  const onClick = opts.onClick || '';
  return `
    <label class="naowee-checkbox${checked ? ' naowee-checkbox--checked' : ''}" style="cursor:pointer;display:inline-flex;align-items:flex-start;gap:10px;" onclick="${onClick}">
      <span class="naowee-checkbox__box" style="flex-shrink:0;margin-top:1px;">
        ${checked ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
      </span>
      <span class="naowee-checkbox__label" style="font-size:13.5px;line-height:1.4;">${label}</span>
    </label>
  `;
}

// File drop (canónico wz-file-drop)
// v1.5.7 (25/05/2026): Icono más sutil (20px, stroke 1.5) — antes 32px / 2.
// Feedback Doug: era demasiado grande respecto al resto del DS.
function uploadField(opts) {
  const stateKey = opts.stateKey;
  const cur = getStateAtPath(stateKey);
  const filled = !!cur;
  return `
    <label class="wz-file-drop${filled ? ' is-filled' : ''}">
      <span class="wz-file-drop__icon">
        ${filled
          ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 11 17 15 13"/></svg>'
          : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>'}
      </span>
      ${filled
        ? `<div class="wz-file-drop__title">Archivo cargado</div>
           <div class="wz-file-drop__name">${esc(cur.name)} · ${esc(cur.size)}</div>
           <button type="button" class="naowee-btn naowee-btn--quiet naowee-btn--small" onclick="event.preventDefault();event.stopPropagation();clearStateAtPath('${stateKey}');render();" style="margin-top:6px;">Quitar archivo</button>`

/* ============================================================
   Stepper
   ============================================================ */
function renderStepper() {
  const wrap = document.getElementById('stepperDesktop');
  // v1.5.7: itera solo los pasos aplicables al tipo de organismo y usa el
  // índice VISUAL para la numeración (no el índice absoluto del array STEPS).
  const aplicables = pasosAplicables();
  const visualActual = indiceVisual(STATE.step);
  let html = '';
  aplicables.forEach((stepIdx, visualIdx) => {
    const s = STEPS[stepIdx];
    let stateCls = '';
    if (visualActual >= 0 && visualIdx < visualActual) stateCls = 'naowee-stepper__step--done';
    else if (visualIdx === visualActual) stateCls = 'naowee-stepper__step--active';

    const numberHtml = (visualActual >= 0 && visualIdx < visualActual)
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
      : (visualIdx + 1);

    // Solo permitimos ir hacia atrás (no saltar adelante). Click en step ya completado.
    const clickable = (visualActual >= 0 && visualIdx < visualActual);
    html += `
      <div class="naowee-stepper__step ${stateCls}" role="listitem"${clickable ? ` onclick="STATE.step=${stepIdx};render();"` : ''}>
        <span class="naowee-stepper__number">${numberHtml}</span>
        <span class="naowee-stepper__label">${esc(s.label)}</span>
      </div>
    `;
    if (visualIdx < aplicables.length - 1) {
      const connectorDone = (visualActual >= 0 && visualIdx < visualActual);
      html += `<div class="naowee-stepper__connector${connectorDone ? ' naowee-stepper__connector--done' : ''}"></div>`;
    }
  });

  // v1.13.54 (Juanma): si aún no se eligió organismo, dibujar el resto del
  // recorrido como skeleton (5 puntos grises + línea), sin label ni número.
  if (!STATE.tipoOrganismo) {
    const SKELETON_STEPS = 5;
    for (let i = 0; i < SKELETON_STEPS; i++) {
      html += `<div class="naowee-stepper__connector naowee-stepper__connector--skeleton"></div>`;
      html += `<div class="naowee-stepper__step naowee-stepper__step--skeleton" role="presentation" aria-hidden="true"><span class="naowee-stepper__number"></span></div>`;
    }
  }

  wrap.innerHTML = html;

  document.getElementById('stepperMobile').innerHTML = `
    Paso ${(visualActual >= 0 ? visualActual : 0) + 1} de ${aplicables.length}
    <small>${esc(STEPS[STATE.step].label)}</small>
  `;
}

  const orgOptions = [
