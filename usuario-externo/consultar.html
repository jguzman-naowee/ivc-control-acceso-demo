    /* ─── Histórico timeline — UX Pro Max v1.13.23 ────────────────────
       Refactor de legibilidad: cada evento se representa como una tarjeta
       con título humanizado, badge semántico, descripción narrativa y
       (cuando aplique) un chip técnico con la transición de estado. */

    /* Diccionario de nombres humanizados para los estados internos del
       state machine. Si no está en la tabla, se devuelve el original. */
    var STATE_LABELS_PUB = {
      'No asignada':          'No asignada',
      'Asignada':             'Asignada',
      'En validación':        'En validación',
      'Cumple':               'Cumple',
      'Parcial':              'Cumplimiento parcial',
      'NoCumple':             'No cumple',
      'PendienteCOO':         'Pendiente revisión Coordinador',
      'PendienteFirma':       'Pendiente firma Director',
      'Firmado':              'Acto firmado',
      'NotifElectronica':     'Notificación electrónica',
      'NotifOficinas':        'Notificación en oficinas',
      'Vigente':              'Acto vigente',
      'PendienteRecursos':    'Pendiente recursos',
      'PendienteRecursoTipo': 'Tipo de recurso',
      'EnApelacion':          'En apelación',
      'EnReposicion':         'En reposición'
    };

    /* Parsea "Estado: X → Y · descripción" en sus 3 partes; cuando no
       coincide el patrón, devuelve null para evitar mostrar ruido. */
    function _parseAccion(text) {
      if (!text) return null;
      var m = String(text).match(/^Estado:\s*(.+?)\s*→\s*(.+?)(?:\s*·\s*(.+))?$/);
      if (!m) return null;
      return {
        from: (m[1] || '').trim(),
        to:   (m[2] || '').trim(),
        desc: (m[3] || '').trim()
      };
    }

    /* Devuelve { label, variant } para el badge semántico del evento.
       Variant mapea a las clases canónicas del DS (positive/caution/
       negative/informative). */
    function _eventoBadge(accion) {
      var a = (accion || '').toLowerCase();
      if (a.indexOf('subsanación') >= 0)                            return { label: 'Subsanación',  variant: 'informative' };
      if (a.indexOf('no cumple') >= 0 || a.indexOf('rechaz') >= 0) return { label: 'No cumple',    variant: 'negative' };
      if (a.indexOf('cumplimiento parcial') >= 0 || a.indexOf('parcial') >= 0 || a.indexOf('devuelt') >= 0)
                                                                    return { label: 'Parcial',      variant: 'caution' };
      if (a.indexOf('apelaci') >= 0)                                return { label: 'Apelación',    variant: 'caution' };
      if (a.indexOf('reposici') >= 0)                               return { label: 'Reposición',   variant: 'caution' };
      if (a.indexOf('recurso') >= 0)                                return { label: 'Recurso',      variant: 'caution' };
      if (a.indexOf('renunc') >= 0)                                 return { label: 'Renuncia',     variant: 'positive' };
      if (a.indexOf('vigente') >= 0)                                return { label: 'Vigente',      variant: 'positive' };
      if (a.indexOf('firma') >= 0)                                  return { label: 'Firmado',      variant: 'positive' };
      if (a.indexOf('aprob') >= 0)                                  return { label: 'Aprobado',     variant: 'positive' };
      if (a.indexOf('acto') >= 0 && a.indexOf('generado') >= 0)    return { label: 'Acto generado',variant: 'positive' };
      if (a.indexOf('notificad') >= 0 || a.indexOf('notificación') >= 0)
                                                                    return { label: 'Notificación', variant: 'informative' };
      if (a.indexOf('asignad') >= 0)                                return { label: 'Asignación',   variant: 'informative' };
      if (a.indexOf('inicio de validaci') >= 0)                    return { label: 'En validación',variant: 'informative' };
      if (a.indexOf('remisi') >= 0)                                 return { label: 'Remisión',     variant: 'informative' };
      if (a.indexOf('radicad') >= 0)                                return { label: 'Radicado',     variant: 'informative' };
      return { label: 'Evento', variant: 'neutral' };
    }

    /* Variant del dot del timeline en base al badge. */
    function _eventoDotVariant(badge) {
      if (!badge) return 'muted';
      if (badge.variant === 'positive')    return 'positive';
      if (badge.variant === 'caution')     return 'caution';
      if (badge.variant === 'negative')    return 'negative';
      if (badge.variant === 'informative') return 'info';
      return 'muted';
    }

    /* Devuelve un título humanizado y una descripción narrativa para
       el evento. El título es corto y orientado a usuario público; la
       descripción es la oración explicativa (sin la transición técnica). */
    function _eventoTitulo(accion, badge, parsed) {
      var a = (accion || '').toLowerCase();
      /* Casos especiales con título narrativo más amable. */
      if (a.indexOf('subsanación radicada') >= 0)        return 'Subsanación radicada por el organismo';
      if (a.indexOf('subsanación') >= 0)                  return 'Subsanación';
      if (a.indexOf('no cumple') >= 0)                    return 'Los documentos no cumplen los requisitos';
      if (a.indexOf('cumplimiento parcial') >= 0 || a.indexOf('parcial') >= 0)
                                                          return 'Cumplimiento parcial — requiere subsanación';
      if (a.indexOf('acto') >= 0 && a.indexOf('generado') >= 0)
                                                          return 'Acto administrativo generado';
      if (a.indexOf('aprob') >= 0 && a.indexOf('coordinador') >= 0)
                                                          return 'Acto aprobado por el Coordinador';
      if (a.indexOf('firma') >= 0 && a.indexOf('firmado electrónicamente') >= 0)
                                                          return 'Acto firmado por el Director';
      if (a.indexOf('firma') >= 0)                        return 'Acto firmado por el Director';
      if (a.indexOf('notificación electrónica') >= 0)    return 'Notificación electrónica enviada';
      if (a.indexOf('notificación en oficinas') >= 0 || a.indexOf('alerta de notificación en oficinas') >= 0)
                                                          return 'Alerta de notificación en oficinas';
      if (a.indexOf('renunció a términos') >= 0)         return 'Organismo renunció a términos';
      if (a.indexOf('no renunció') >= 0)                  return 'Organismo no renunció a términos';
      if (a.indexOf('vigente') >= 0)                      return 'Acto administrativo vigente';
      if (a.indexOf('apelaci') >= 0)                      return 'Recurso de apelación interpuesto';
      if (a.indexOf('reposici') >= 0)                     return 'Recurso de reposición interpuesto';
      if (a.indexOf('interpone recursos') >= 0)          return 'Organismo interpone recursos';
      if (a.indexOf('inicio de validaci') >= 0)          return 'Inicio de validación';
      if (a.indexOf('asignad') >= 0)                      return accion;          /* "Asignada a Carlos Pérez" */
      if (a.indexOf('remisi') >= 0)                       return accion;          /* "Remisión automática a..." */
      if (a.indexOf('radicado') >= 0)                     return 'Trámite radicado';
      /* Fallback: si parseamos transición, usar el label del badge;
         si no, devolvemos el texto crudo. */
      if (parsed && badge) return badge.label;
      return accion || 'Evento';
    }

    /* Extrae la descripción narrativa, eliminando el prefijo técnico
       "Estado: X → Y · " si está presente. */
    function _eventoDesc(accion, parsed) {
      if (!accion) return '';
      if (parsed && parsed.desc) return parsed.desc;
      /* Si no hubo prefijo de Estado pero hay "·" en el texto, devolver
         lo que viene después del primer "·". */
      var idx = accion.indexOf('·');
      if (idx >= 0) return accion.slice(idx + 1).trim();
      return '';
    }

    /* Devuelve el nombre humanizado de un estado interno. */
    function _humanState(s) {
      if (!s) return s;
      return STATE_LABELS_PUB[s] || s;
    }

    function renderHistorico(t) {
      var events = (t.historico || []).slice().reverse();
      if (events.length === 0) return '';
      return '<section class="section">' +
        '<div class="section__header">' +
          '<h3 class="section__title">Histórico del trámite</h3>' +
        '</div>' +
        '<ol class="ctx-timeline">' +
          events.map(function (e, i) {
            var accion = e.accion || '';
            var parsed = _parseAccion(accion);
            var badge  = _eventoBadge(accion);
            var titulo = _eventoTitulo(accion, badge, parsed);
            var desc   = _eventoDesc(accion, parsed);
            var variant = i === 0 ? _eventoDotVariant(badge) : 'muted';

            var badgeHtml = badge
              ? '<span class="ctx-timeline__badge">' +
                  '<span class="naowee-badge naowee-badge--' + badge.variant + ' naowee-badge--quiet naowee-badge--small">' +
                    escHtml(badge.label) +
                  '</span>' +
                '</span>'
              : '';

            var transitionHtml = (parsed && parsed.from && parsed.to)
              ? '<span class="ctx-timeline__transition">' +
                  '<span class="ctx-timeline__transition-from">' + escHtml(_humanState(parsed.from)) + '</span>' +
                  '<span class="ctx-timeline__transition-arrow">→</span>' +
                  '<span class="ctx-timeline__transition-to">' + escHtml(_humanState(parsed.to)) + '</span>' +
                '</span>'
              : '';

            var descHtml = desc
              ? '<p class="ctx-timeline__desc">' + escHtml(desc) + '</p>'
              : '';

            var fecha = e.fecha ? formatDate(e.fecha) : '';
            var hora  = e.hora || '';
            var actor = e.actor || '';
            var footParts = [];
            if (fecha) footParts.push('<span class="ctx-timeline__date">' + escHtml(fecha + (hora ? ' · ' + hora : '')) + '</span>');
            if (actor) footParts.push('<span class="ctx-timeline__sep">·</span><span class="ctx-timeline__actor">' + escHtml(actor) + '</span>');
            var footHtml = footParts.length
              ? '<div class="ctx-timeline__foot">' + footParts.join('') + '</div>'
              : '';

            return '<li class="ctx-timeline__item ctx-timeline__item--' + variant + '">' +
              '<span class="ctx-timeline__dot" aria-hidden="true"></span>' +
              '<div class="ctx-timeline__card">' +
                '<div class="ctx-timeline__head">' +
                  '<div class="ctx-timeline__title">' + escHtml(titulo) + '</div>' +
                  badgeHtml +
                '</div>' +
                descHtml +
                transitionHtml +
                footHtml +
              '</div>' +
            '</li>';
          }).join('') +
        '</ol>' +
      '</section>';
    }

    /* ─── Modal de subsanación (v1.9.0 — componentes canónicos DS) ───── */
    var MAX_UPLOAD_BYTES = 10 * 1024 * 1024;   /* 10 MB */
    var ICON_FILE_FILLED = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 11 17 15 13"/></svg>';
    var ICON_FILE_UP     = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
    var ICON_HELPER_X    = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

    function _renderFileDrop(docId, obs) {
      /* v1.9.7: layout reordenado — obs ahora vive DEBAJO del file-drop (no
         en el header del item), y el helper de errores queda al final. */
      var obsHtml = obs
        ? '<div class="subsanar-doc-item__obs">' + escHtml(obs) + '</div>'
        : '';
      return '<label class="ivc-file-drop" for="file-' + escHtml(docId) + '" data-doc-id="' + escHtml(docId) + '">' +
        '<span class="ivc-file-drop__icon">' + ICON_FILE_UP + '</span>' +
        '<div class="ivc-file-drop__title">Cargar documento corregido</div>' +
        '<div class="ivc-file-drop__hint">PDF, DOC o DOCX · máx. 10 MB</div>' +
        '<input type="file" id="file-' + escHtml(docId) + '" accept=".pdf,.doc,.docx,application/pdf" onchange="_onUploadChange(this)" />' +
      '</label>' +
      obsHtml +
      '<div class="naowee-helper naowee-helper--negative" id="err-' + escHtml(docId) + '" hidden>' +
        '<span class="naowee-helper__badge">' + ICON_HELPER_X + '</span>' +
        '<span class="naowee-helper__text"></span>' +
      '</div>';
    }

    window._openSubsanarModal = function () {
      var t = IVCState.tramite;
      if (!t) return;
      var docs = (Array.isArray(t.documentos) ? t.documentos : []).filter(function (d) {
        return d.validacion === 'no' || d.validacion === 'obs';
      });
      if (docs.length === 0) {
        docs = [{ id: 'general', orden: 1, titulo: 'Documentación corregida', observacion: 'Adjunte los documentos solicitados en el acto administrativo.' }];
      }

      var overlay = document.createElement('div');
      overlay.className = 'naowee-modal-overlay open';
      overlay.id = 'subsanarOverlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.innerHTML =
        '<div class="naowee-modal" style="width:95vw; max-width: 720px; display:flex; flex-direction:column; max-height: 88vh;">' +
          '<div class="naowee-modal__header" style="flex-shrink:0;">' +
            '<div class="naowee-modal__title-group">' +
              '<h2 class="naowee-modal__title">Radicar subsanación</h2>' +
              '<p class="naowee-modal__subtitle">' + escHtml(t.id) + ' · ' + escHtml(t.organismo) + '</p>' +
            '</div>' +
            '<button type="button" class="naowee-modal__dismiss" onclick="_closeSubsanarModal()" aria-label="Cerrar">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
            '</button>' +
          '</div>' +
          '<div class="naowee-modal__body" style="flex: 1 1 auto; overflow-y:auto; padding: 20px 28px;">' +
            '<div class="naowee-message naowee-message--informative" style="margin-bottom: 18px;">' +
              '<div class="naowee-message__header">' +
                '<div class="naowee-message__icon">' + MSG_ICON_INFO + '</div>' +
                '<div class="naowee-message__title">Documentos por corregir</div>' +
              '</div>' +
              '<div class="naowee-message__text">Adjunte la versión corregida de cada documento. Al radicar, su trámite volverá automáticamente al profesional IVC que lo está revisando.</div>' +
            '</div>' +
            '<div class="subsanar-doc-list">' +
              docs.map(function (d, i) {
                /* v1.13.13: mostrar badge semántico del veredicto del prof
                   (Parcial → caution naranja, No cumple → negative rojo)
                   + título del doc real + observación del prof si existe. */
                var vBadge = '';
                if (d.validacion === 'obs') {
                  vBadge = ' <span class="naowee-badge naowee-badge--caution naowee-badge--quiet naowee-badge--small" style="margin-left:8px;">Cumplimiento parcial</span>';
                } else if (d.validacion === 'no') {
                  vBadge = ' <span class="naowee-badge naowee-badge--negative naowee-badge--quiet naowee-badge--small" style="margin-left:8px;">No cumple</span>';
                }
                return '<div class="subsanar-doc-item">' +
                  '<div class="subsanar-doc-item__header">' +
                    '<div class="subsanar-doc-item__num">' + (d.orden || (i + 1)) + '</div>' +
                    '<div style="flex:1;min-width:0;">' +
                      '<div class="subsanar-doc-item__title">' + escHtml(d.titulo) + vBadge + '</div>' +
                    '</div>' +
                  '</div>' +
                  _renderFileDrop(d.id, d.observacion) +
                '</div>';
              }).join('') +
            '</div>' +
            /* Textarea canónico DS (.naowee-textfield --textarea pattern) */
            '<div class="naowee-textfield naowee-textfield--textarea" style="margin-top: 8px;">' +
              '<label class="naowee-textfield__label" for="subsanarObs">Comentarios adicionales <span style="color:var(--text-secondary);font-weight:400;">(opcional)</span></label>' +
              '<div class="naowee-textfield__input-wrap" style="height:auto; padding: 10px 12px;">' +
                '<textarea class="naowee-textfield__input" id="subsanarObs" maxlength="500" rows="4" placeholder="Describa brevemente los cambios realizados…" style="min-height:88px; resize:vertical; line-height:1.5; border:0; outline:none; width:100%; background:transparent; font-family:inherit; font-size:14px; color:inherit;"></textarea>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="naowee-modal__footer" style="flex-shrink:0; padding: 16px 28px; border-top: 1px solid var(--border); display:flex; justify-content:flex-end;">' +
            /* v1.9.7: CTA --large + disabled por default. Se activa cuando al
               menos un documento válido se sube exitosamente (file-drop is-filled). */
            '<button id="subsanarConfirmBtn" class="naowee-btn naowee-btn--loud naowee-btn--large" onclick="_confirmSubsanacion()" disabled>Radicar subsanación</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
    };
    window._closeSubsanarModal = function () {
      var el = document.getElementById('subsanarOverlay');
      if (el) el.remove();
    };
    /* v1.9.0: upload con validación de tamaño máx (10 MB). Si excede →
       muestra .naowee-helper--negative bajo el file-drop.
       v1.9.7: tras cualquier cambio, recalcula si el CTA "Radicar" debe
       habilitarse (al menos 1 file-drop con clase is-filled). */
    window._onUploadChange = function (input) {
      var file = input.files && input.files[0];
      var dropEl = input.closest('.ivc-file-drop');
      var docId = dropEl && dropEl.getAttribute('data-doc-id');
      var errEl = docId && document.getElementById('err-' + docId);
      var errTxt = errEl && errEl.querySelector('.naowee-helper__text');

      /* Reset estados */
      if (dropEl) {
        dropEl.classList.remove('is-error');
      }
      if (errEl) errEl.hidden = true;

      if (!file) { _updateSubsanarBtnState(); return; }

      /* Validación: máx 10 MB */
      if (file.size > MAX_UPLOAD_BYTES) {
        var mb = (file.size / (1024 * 1024)).toFixed(1);
        if (dropEl) dropEl.classList.add('is-error');
        if (errTxt) errTxt.textContent = 'El archivo "' + file.name + '" pesa ' + mb + ' MB. El máximo permitido es 10 MB.';
        if (errEl) errEl.hidden = false;
        input.value = '';  /* limpia el file input */
        _updateSubsanarBtnState();
        return;
      }

      /* OK — marca el drop como "filled" con el nombre del archivo */
      if (dropEl) {
        dropEl.classList.add('is-filled');
        var icon = dropEl.querySelector('.ivc-file-drop__icon');
        if (icon) icon.innerHTML = ICON_FILE_FILLED;
        var title = dropEl.querySelector('.ivc-file-drop__title');
        if (title) title.textContent = 'Archivo cargado';
        var hint  = dropEl.querySelector('.ivc-file-drop__hint');
        if (hint)  hint.style.display = 'none';
        /* Inserta el name si no existe */
        if (!dropEl.querySelector('.ivc-file-drop__name')) {
          var n = document.createElement('div');
          n.className = 'ivc-file-drop__name';
          n.textContent = file.name + ' · ' + _bytesToMb(file.size);
          dropEl.insertBefore(n, dropEl.querySelector('input'));
        }
      }
      _updateSubsanarBtnState();
    };

    /* v1.9.7: gate del CTA "Radicar subsanación" — habilita sólo cuando
       hay al menos un file-drop con clase is-filled (upload válido). */
    function _updateSubsanarBtnState() {
      var btn = document.getElementById('subsanarConfirmBtn');
      if (!btn) return;
      var hasValid = document.querySelectorAll('#subsanarOverlay .ivc-file-drop.is-filled').length > 0;
      btn.disabled = !hasValid;
    }
    function _bytesToMb(b) {
      var mb = b / (1024 * 1024);
      return (mb < 1 ? (b / 1024).toFixed(0) + ' KB' : mb.toFixed(2) + ' MB');
    }

    window._confirmSubsanacion = function () {
      var t = IVCState.tramite;
      if (!t) return;
      var obs = (document.getElementById('subsanarObs') || {}).value || '';

      /* v1.13.13: reset solo los docs marcados como obs/no a validacion=null
         (el organismo los subsanó, vuelven a estado pendiente de revisar).
         Los cumple permanecen → cuando el profesional reabre el workspace,
         solo necesita revisar los que subsanaron, los demás siguen verdes. */
      var docs = Array.isArray(t.documentos) ? t.documentos.slice() : [];
      var subsanadosIds = [];
      docs = docs.map(function (d) {
        if (d.validacion === 'obs' || d.validacion === 'no') {
          subsanadosIds.push(d.titulo || d.id);
          return Object.assign({}, d, {
            validacion: null,
            observacion: '',
            __subsanado_prev: d.validacion,
            __subsanado_obs:  d.observacion || ''
          });
        }
        return d;
      });
      IVCStore.setDocumentos(t.id, docs);

      var profesional = t.profesionalNombre ? ' · vuelve a ' + t.profesionalNombre + ' para revisión' : '';
      var actorOrg = t.organismo + ' (Organismo)';
      var detalleSubs = subsanadosIds.length
        ? 'Subsanación radicada: ' + subsanadosIds.length + ' documento(s) corregido(s) · ' + subsanadosIds.join(', ')
        : 'Subsanación radicada';
      var detalle = detalleSubs + (obs ? ' · ' + obs : '') + profesional;
      IVCStore.actualizarEstado(t.id, 'En validación', actorOrg, detalle);

      _closeSubsanarModal();
      /* v1.9.7: snackbar canónico --success con check icon verde. */
      _showSnackbar('Subsanación radicada con éxito. Su trámite vuelve a revisión por el profesional asignado.', 'success');

      setTimeout(function () {
        IVCState.tramite = IVCStore.getTramite(t.id);
        route();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 200);
    };

    /* ─── Helpers ──────────────────────────────────────────────────── */
    window._mockDownload = function (filename) {
      _showSnackbar('Descargando ' + filename + ' (mock)');
    };

    /* v1.9.7: Snackbar canónico DS — mirror del patrón del módulo Project.
       Soporta variants: 'default' (dark pill), 'success' (check verde).
       Backward compat: _showToast() sigue funcionando como alias. */
    var SNACKBAR_ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

    function _showSnackbar(msg, variant) {
      /* Limpia snackbars previos */
      var prev = document.querySelectorAll('.ivc-snackbar');
      for (var i = 0; i < prev.length; i++) prev[i].remove();

      var el = document.createElement('div');
      el.className = 'ivc-snackbar' + (variant === 'success' ? ' ivc-snackbar--success' : '');
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');

      var iconHtml = variant === 'success'
        ? '<span class="ivc-snackbar__icon">' + SNACKBAR_ICON_CHECK + '</span>'
        : '';
      el.innerHTML = iconHtml + '<span class="ivc-snackbar__text"></span>';
      el.querySelector('.ivc-snackbar__text').textContent = msg;

      document.body.appendChild(el);
      /* Trigger entrada (next frame para que la transición corra) */
      requestAnimationFrame(function () {
        el.classList.add('is-visible');
      });
      setTimeout(function () {
        el.classList.remove('is-visible');
        setTimeout(function () { el.remove(); }, 280);
      }, 3200);
    }
    /* Backward compat */
    function _showToast(msg) { _showSnackbar(msg); }
  </script>
</body>
</html>
