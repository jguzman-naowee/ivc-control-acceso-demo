<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi firma · Director IVC</title>
  <link rel="stylesheet" href="../shared/fonts/google-sans.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/naowee-tech/naowee-design-system@v1.8.0/dist/design-system.css">

  <link rel="stylesheet" href="../shared/tokens.css?v=1.13.56">
  <link rel="stylesheet" href="../shared/components.css?v=1.13.57">
  <link rel="stylesheet" href="../shared/shell.css?v=1.13.56">
  <link rel="stylesheet" href="../shared/naowee-footer.css?v=1.13.56">
  <style>/* FOOTER POINTER FIX INLINE — v1.12.5 defensive — Doug reportó que el cache de file:// servía CSS viejo y el footer flotante seguía bloqueando hover/click sobre las tablas. Esta regla está inline en el HTML para vencer al CSS externo cacheado. */ .naowee-floating-footer { pointer-events: none !important; } .naowee-floating-footer__version, .naowee-floating-footer__logo, .naowee-floating-footer__text, .naowee-floating-footer__sep { pointer-events: auto !important; }</style>

  <style>
    /* ═══════════════════════════════════════════════════════════════════
       Mi firma · Director IVC
       v1.11.0 (2026-05-26)

       Light experience: upload PNG/JPG → preview → guardar en localStorage
       como base64 (preset reutilizable). El preset se aplica automáticamente
       al firmar cualquier acto administrativo en /director/bandeja.html.
       ═══════════════════════════════════════════════════════════════════ */

    .page-title-block { margin-bottom: 4px; }
    .page-title {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.5px;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .page-subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    /* v1.13.21 (Doug 27/05/2026): page-inner 1480 con title a la izquierda;
       el card de firma se centra horizontalmente (margin auto). */
    .page-inner { max-width: 1480px !important; }
    .page-title-block { max-width: 720px; }

    /* ── Card principal ─────────────────────────────────────────────── */
    .firma-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg, 12px);
      padding: 28px;
      margin: 28px auto 0;       /* v1.13.21: auto center horizontal */
      max-width: 720px;
    }

    /* ── Drop zone ──────────────────────────────────────────────────── */
    .firma-drop {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      padding: 36px 24px;
      border: 1.5px dashed var(--border-dark, #d0d4e6);
      border-radius: 12px;
      background: #fafbff;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      position: relative;
      min-height: 200px;
      justify-content: center;
      text-align: center;
    }
    .firma-drop:hover {
      border-color: var(--accent, #d74009);
      background: #fff8f4;
    }
    .firma-drop.is-dragover {
      border-color: var(--accent, #d74009);
      background: var(--orange-bg, #fff3e6);
    }
    .firma-drop.is-error {
      border-color: #c01818;
      background: #fff0ee;
      border-style: solid;
    }
    .firma-drop__icon {
      width: 56px; height: 56px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--orange-bg, #fff3e6);
      color: var(--accent, #d74009);
    }
    .firma-drop__title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .firma-drop__hint {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 360px;
    }
    .firma-drop input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
    }

    /* ── Preview (cuando hay firma cargada) ─────────────────────────── */
    .firma-preview {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
    }
    .firma-preview__label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .firma-preview__image-wrap {
      width: 100%;
      max-width: 480px;
      min-height: 140px;
      padding: 20px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .firma-preview__image {
      max-width: 100%;
      max-height: 120px;
      display: block;
      object-fit: contain;
    }
    .firma-preview__meta {
      font-size: 12.5px;
      color: var(--text-secondary);
      text-align: center;
    }
    .firma-preview__meta strong { color: var(--text-primary); font-weight: 600; }

    /* ── Actions row ────────────────────────────────────────────────── */
    .firma-actions {
      display: flex; gap: 10px; justify-content: flex-end;
      margin-top: 20px;
    }
    @media (max-width: 600px) {
      .firma-actions { flex-direction: column-reverse; }
      .firma-actions > * { width: 100%; justify-content: center; }
    }

    /* ── Info message canónico ──────────────────────────────────────── */
    .firma-info {
      margin-bottom: 20px;
    }

    /* ── Status indicator del header ────────────────────────────────── */
    .firma-status {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
    }
    .firma-status--ok {
      background: var(--green-bg, #e6f4e7);
      color: var(--green, #1f8923);
    }
    .firma-status--missing {
      background: var(--orange-bg, #fff3e6);
      color: var(--accent, #d74009);
    }
  </style>
</head>
<body>

  <div class="shell" id="app-shell"></div>

  <template id="page-content">
    <div class="page-inner">

      <header class="page-title-block">
        <h1 class="page-title">Mi firma electrónica</h1>
        <p class="page-subtitle">Suba su firma como imagen una sola vez. Será aplicada automáticamente a los actos administrativos al firmarlos.</p>
        <div id="firmaStatusChip" class="firma-status firma-status--missing" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="firmaStatusText">Sin firma cargada</span>
        </div>
      </header>

      <section class="firma-card">

        <div id="firmaInfoMessage" class="firma-info">
          <div class="naowee-message naowee-message--informative">
            <div class="naowee-message__header">
              <span class="naowee-message__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              </span>
              <span class="naowee-message__title">Cómo funciona</span>
            </div>
            <div class="naowee-message__text">
              La firma se almacena de forma segura en su sesión y se inserta en el pie del acto administrativo al confirmar la firma electrónica. Puede reemplazarla en cualquier momento; el cambio aplica a los actos futuros.
            </div>
          </div>
        </div>

        <!-- Vista cuando NO hay firma cargada: drop zone -->
        <div id="firmaUploadView">
          <label class="firma-drop" id="firmaDropZone" for="firmaFileInput">
            <span class="firma-drop__icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </span>
            <div class="firma-drop__title">Cargar firma electrónica</div>
            <div class="firma-drop__hint">Arrastre una imagen aquí o haga click para seleccionar.<br>Formatos: PNG o JPG · máx. 2 MB · fondo transparente recomendado.</div>
            <input type="file" id="firmaFileInput" accept="image/png,image/jpeg" />
          </label>

          <div class="naowee-helper naowee-helper--negative" id="firmaError" hidden style="margin-top: 10px;">
            <span class="naowee-helper__badge">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </span>
            <span class="naowee-helper__text"></span>
          </div>

          <div class="firma-actions">
            <button type="button" class="naowee-btn naowee-btn--mute" id="btnCancelUpload" disabled>Cancelar</button>
            <button type="button" class="naowee-btn naowee-btn--loud" id="btnGuardarFirma" disabled>Guardar firma</button>
          </div>
        </div>

        <!-- Vista cuando ya hay firma guardada: preview -->
        <div id="firmaSavedView" hidden>
          <div class="firma-preview">
            <span class="firma-preview__label">Firma activa</span>
            <div class="firma-preview__image-wrap">
              <img id="firmaSavedImage" class="firma-preview__image" alt="Firma del Director IVC" />
            </div>
            <div class="firma-preview__meta">
              Guardada el <strong id="firmaSavedDate">—</strong> · <strong id="firmaSavedSize">—</strong>
            </div>
          </div>

          <div class="firma-actions">
            <!-- v1.13.21: ghost button canónico DS (mute) — label naranja
                 idle + hover peach claro. Doug pidió que NO sea destructive
                 rojo sino el ghost orange del DS. -->
            <button type="button" class="naowee-btn naowee-btn--mute" id="btnEliminarFirma">Eliminar firma</button>
            <button type="button" class="naowee-btn naowee-btn--loud" id="btnReemplazarFirma">Reemplazar firma</button>
          </div>
        </div>

      </section>

    </div>
  </template>

  <!-- Snackbar canónico -->
  <style>
    .ivc-snackbar {
      position: fixed; left: 50%; bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      display: inline-flex; align-items: center;
      gap: 12px;
      padding: 12px 18px 12px 14px;
      background: #282834;
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0,0,0,.22), 0 0 0 1px rgba(255,255,255,.06);
      font-size: 13px; font-weight: 500;
      line-height: 1.4;
      max-width: min(560px, calc(100vw - 32px));
      z-index: 9999;
      opacity: 0;
      transition: opacity .25s ease, transform .25s cubic-bezier(.16,1,.3,1);
    }
    .ivc-snackbar.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .ivc-snackbar__icon {
      width: 24px; height: 24px; flex-shrink: 0;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.08);
    }
    .ivc-snackbar--success .ivc-snackbar__icon { background: #1f8923; color: #fff; }
    .ivc-snackbar__text { flex: 1; min-width: 0; }
    .naowee-helper[hidden] { display: none !important; }
  </style>

  <!-- Scripts -->
  <script src="../shared/data.js?v=1.13.56"></script>
  <script src="../shared/shell.js?v=1.13.56"></script>
  <script src="../shared/ivc-store.js?v=1.13.56"></script>
  <script src="../shared/naowee-footer.js?v=1.13.56" defer></script>

  <script>
    /* ═══════════════════════════════════════════════════════════════════
       Perfil del Director — gestión del preset de firma.
       Storage: localStorage key 'ivc-director-firma' = { dataUrl, name, size, savedAt }
       ═══════════════════════════════════════════════════════════════════ */

    var FIRMA_KEY = 'ivc-director-firma';
    var MAX_BYTES = 2 * 1024 * 1024;  /* 2 MB */
    var pendingFile = null;
    var pendingDataUrl = null;

    document.addEventListener('DOMContentLoaded', function () {
      window.IVCData.setPerfil('director');

      var template = document.getElementById('page-content');
      var shellRoot = document.getElementById('app-shell');
      shellRoot.innerHTML = template.innerHTML;

      window.IVCShell.init({ title: null, activeNav: 'perfil-director' });

      renderState();
      wireUpload();
      wireSavedActions();
    });

    function renderState() {
      var firma = getFirma();
      var uploadView = document.getElementById('firmaUploadView');
      var savedView = document.getElementById('firmaSavedView');
      var statusChip = document.getElementById('firmaStatusChip');
      var statusText = document.getElementById('firmaStatusText');

      if (firma && firma.dataUrl) {
        uploadView.hidden = true;
        savedView.hidden = false;
        document.getElementById('firmaSavedImage').src = firma.dataUrl;
        document.getElementById('firmaSavedDate').textContent = _fmtDate(firma.savedAt);
        document.getElementById('firmaSavedSize').textContent = _fmtSize(firma.size);

        statusChip.classList.remove('firma-status--missing');
        statusChip.classList.add('firma-status--ok');
        statusChip.innerHTML =
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
          '<span>Firma activa · guardada el ' + _fmtDate(firma.savedAt) + '</span>';
        statusChip.hidden = false;
      } else {
        uploadView.hidden = false;
        savedView.hidden = true;
        statusChip.classList.remove('firma-status--ok');
        statusChip.classList.add('firma-status--missing');
        statusChip.innerHTML =
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
          '<span>Sin firma cargada</span>';
        statusChip.hidden = false;
      }
    }

    function wireUpload() {
      var dropZone = document.getElementById('firmaDropZone');
      var input = document.getElementById('firmaFileInput');
      var errEl = document.getElementById('firmaError');
      var errTxt = errEl.querySelector('.naowee-helper__text');
      var btnGuardar = document.getElementById('btnGuardarFirma');
      var btnCancel = document.getElementById('btnCancelUpload');

      function setError(msg) {
        errTxt.textContent = msg;
        errEl.hidden = false;
        dropZone.classList.add('is-error');
      }
      function clearError() {
        errEl.hidden = true;
        dropZone.classList.remove('is-error');
      }

      function loadFile(file) {
        clearError();
        if (!file) return;
        /* Validate type */
        if (!/^image\/(png|jpe?g)$/i.test(file.type)) {
          setError('Solo se permiten imágenes PNG o JPG. Archivo recibido: ' + (file.type || 'desconocido'));
          input.value = '';
          return;
        }
        if (file.size > MAX_BYTES) {
          var mb = (file.size / (1024 * 1024)).toFixed(1);
          setError('La imagen pesa ' + mb + ' MB. El máximo permitido es 2 MB.');
          input.value = '';
          return;
        }
        var reader = new FileReader();
        reader.onload = function (e) {
          pendingFile = file;
          pendingDataUrl = e.target.result;

          /* Cambiar visual del drop zone a "loaded" state mostrando preview inline */
          dropZone.innerHTML =
            '<img src="' + e.target.result + '" alt="Preview" style="max-width:280px;max-height:120px;object-fit:contain;border-radius:6px;">' +
            '<div class="firma-drop__title" style="color: var(--green, #1f8923); margin-top: 8px;">Imagen cargada · revise el preview antes de guardar</div>' +
            '<div class="firma-drop__hint">' + _escape(file.name) + ' · ' + _fmtSize(file.size) + '</div>' +
            '<input type="file" id="firmaFileInput" accept="image/png,image/jpeg" />';
          /* Rebind el nuevo input */
          input = document.getElementById('firmaFileInput');
          input.addEventListener('change', function (ev) { loadFile(ev.target.files && ev.target.files[0]); });

          btnGuardar.disabled = false;
          btnCancel.disabled = false;
        };
        reader.readAsDataURL(file);
      }

      input.addEventListener('change', function (ev) {
        loadFile(ev.target.files && ev.target.files[0]);
      });

      /* Drag-drop */
      dropZone.addEventListener('dragover', function (ev) {
        ev.preventDefault();
        dropZone.classList.add('is-dragover');
      });
      dropZone.addEventListener('dragleave', function () {
        dropZone.classList.remove('is-dragover');
      });
      dropZone.addEventListener('drop', function (ev) {
        ev.preventDefault();
        dropZone.classList.remove('is-dragover');
        var file = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
        if (file) loadFile(file);
      });

      btnGuardar.addEventListener('click', function () {
        if (!pendingFile || !pendingDataUrl) return;
        saveFirma({
          dataUrl: pendingDataUrl,
          name: pendingFile.name,
          size: pendingFile.size,
          savedAt: new Date().toISOString()
        });
        _showSnackbar('Firma guardada con éxito. Se aplicará automáticamente al firmar actos.', 'success');
        pendingFile = null;
        pendingDataUrl = null;
        renderState();
      });

      btnCancel.addEventListener('click', function () {
        pendingFile = null;
        pendingDataUrl = null;
        location.reload();
      });
    }

    function wireSavedActions() {
      document.getElementById('btnReemplazarFirma').addEventListener('click', function () {
        clearFirma();
        renderState();
        _showSnackbar('Firma anterior eliminada. Cargue una nueva imagen.', 'success');
      });
      document.getElementById('btnEliminarFirma').addEventListener('click', function () {
        if (!confirm('¿Eliminar la firma activa? No podrá firmar actos hasta cargar una nueva.')) return;
        clearFirma();
        renderState();
        _showSnackbar('Firma eliminada.', 'success');
      });
    }

    /* ─── Storage helpers ──────────────────────────────────────────── */
    function getFirma() {
      try {
        var raw = localStorage.getItem(FIRMA_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }
    function saveFirma(obj) {
      try { localStorage.setItem(FIRMA_KEY, JSON.stringify(obj)); } catch (e) {
        _showSnackbar('No se pudo guardar la firma. Inténtelo de nuevo.', 'success');
      }
    }
    function clearFirma() {
      localStorage.removeItem(FIRMA_KEY);
    }

    /* ─── Snackbar ─────────────────────────────────────────────────── */
    var SNACKBAR_ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    function _showSnackbar(msg, variant) {
      if (window.IVCShell && typeof window.IVCShell.showSnackbar === 'function') {
        window.IVCShell.showSnackbar(msg, variant || 'success');
        return;
      }
      var prev = document.querySelectorAll('.ivc-snackbar');
      for (var i = 0; i < prev.length; i++) prev[i].remove();
      var el = document.createElement('div');
      el.className = 'ivc-snackbar' + (variant === 'success' ? ' ivc-snackbar--success' : '');
      var icon = variant === 'success' ? '<span class="ivc-snackbar__icon">' + SNACKBAR_ICON_CHECK + '</span>' : '';
      el.innerHTML = icon + '<span class="ivc-snackbar__text"></span>';
      el.querySelector('.ivc-snackbar__text').textContent = msg;
      document.body.appendChild(el);
      requestAnimationFrame(function () { el.classList.add('is-visible'); });
      setTimeout(function () {
        el.classList.remove('is-visible');
        setTimeout(function () { el.remove(); }, 280);
      }, 3000);
    }

    /* ─── Helpers ──────────────────────────────────────────────────── */
    function _fmtDate(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      var months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      var hh = String(d.getHours()).padStart(2, '0');
      var mm = String(d.getMinutes()).padStart(2, '0');
      return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ' · ' + hh + ':' + mm;
    }
    function _fmtSize(bytes) {
      if (!bytes) return '—';
      var kb = bytes / 1024;
      return kb < 1024 ? kb.toFixed(0) + ' KB' : (kb / 1024).toFixed(2) + ' MB';
    }
    function _escape(s) {
      return String(s || '').replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    /* Helper expuesto para que /director/bandeja.html pueda checkear si hay firma cargada
       sin duplicar la key del localStorage. */
    window.IVCDirectorFirma = {
      get: getFirma,
      has: function () { var f = getFirma(); return !!(f && f.dataUrl); }
    };
  </script>
</body>
</html>
